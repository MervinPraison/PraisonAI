<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 294" width="880" height="294" role="img" aria-label="MCP both ways - agents use any MCP server over stdio, SSE, Streamable HTTP or WebSocket, and praisonai-mcp serves 85 tools to 22 editors and assistants.">
<style>
.eb{font:500 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9198a1;letter-spacing:.12em}
.ebA{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e0b25a;letter-spacing:.12em}
.h1{font:650 22px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
.h2{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
.tx{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#c9d1d9}
.sm{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9198a1}
.mono{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6edf3}
.pill{fill:#161b22;stroke:#3d444d;stroke-width:1}
.pillHi{fill:#2d2716;stroke:#e0b25a;stroke-width:1.2}
.card{fill:#161b22;stroke:#e6edf3;stroke-width:1.4}
.soft{fill:#1c2128;stroke:#3d444d;stroke-width:1}
.dash{fill:none;stroke:#e0b25a;stroke-width:1.4;stroke-dasharray:6 6}
.wire{fill:none;stroke:#3d444d;stroke-width:1.4}
.flow{fill:none;stroke:#e0b25a;stroke-width:1.6;stroke-dasharray:4 10;animation:flow 1.6s linear infinite}
.flowR{fill:none;stroke:#e0b25a;stroke-width:1.6;stroke-dasharray:4 10;animation:flowR 1.6s linear infinite}
.okb{fill:#1f3326} .okt{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8fc39b}
.acb{fill:#3a2f1a} .act{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e0b25a}
.dot{fill:#e0b25a}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes flowR{to{stroke-dashoffset:28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<text class="eb" x="20" y="22">AGENTS USE MCP SERVERS</text>
<text class="eb" x="246" y="22">PRAISONAI</text>
<text class="eb" x="664" y="22" style="font-size:10.5px">EDITORS USE YOUR AGENTS</text>
<text class="eb" x="20" y="48">TRANSPORTS</text>
<rect class="pill" x="20" y="58" width="170" height="28" rx="14.0"/><text class="tx" x="105.0" y="76.5" text-anchor="middle">stdio</text>
<rect class="pill" x="20" y="94" width="170" height="28" rx="14.0"/><text class="tx" x="105.0" y="112.5" text-anchor="middle">SSE</text>
<rect class="pill" x="20" y="130" width="170" height="28" rx="14.0"/><text class="tx" x="105.0" y="148.5" text-anchor="middle">Streamable HTTP</text>
<rect class="pill" x="20" y="166" width="170" height="28" rx="14.0"/><text class="tx" x="105.0" y="184.5" text-anchor="middle">WebSocket</text>
<text class="ebA" x="674" y="48">22 CLIENTS</text>
<rect class="pillHi" x="674" y="58" width="186" height="28" rx="14.0"/><text class="tx" x="767.0" y="76.5" text-anchor="middle">Cursor</text>
<rect class="pillHi" x="674" y="94" width="186" height="28" rx="14.0"/><text class="tx" x="767.0" y="112.5" text-anchor="middle">Claude Desktop</text>
<rect class="pillHi" x="674" y="130" width="186" height="28" rx="14.0"/><text class="tx" x="767.0" y="148.5" text-anchor="middle">Claude Code</text>
<rect class="pillHi" x="674" y="166" width="186" height="28" rx="14.0"/><text class="tx" x="767.0" y="184.5" text-anchor="middle">VS Code</text>
<rect class="pillHi" x="674" y="202" width="186" height="28" rx="14.0"/><text class="tx" x="767.0" y="220.5" text-anchor="middle">Codex</text>
<rect class="pillHi" x="674" y="238" width="186" height="28" rx="14.0"/><text class="tx" x="767.0" y="256.5" text-anchor="middle">+ 17 more</text>
<rect class="card" x="246" y="38" width="372" height="250" rx="14"/>
<text class="h1" x="268" y="72">PraisonAI</text>
<rect class="okb" x="396.88" y="57" width="97.2" height="20" rx="10"/><circle class="okt" cx="406.88" cy="67" r="2.6"/><text class="okt" x="413.88" y="71">MCP both ways</text>
<rect class="soft" x="266" y="92" width="332" height="82" rx="10"/>
<text class="h2" x="282" y="118">Client</text>
<text class="sm" x="342.4" y="118">Agent(tools=[MCP(...)])</text>
<circle class="dot" cx="288" cy="138" r="2.6"/><text class="tx" x="298" y="142">OAuth sign-in</text>
<circle class="dot" cx="288" cy="160" r="2.6"/><text class="tx" x="298" y="164">Trust and security checks</text>
<rect class="soft" x="266" y="186" width="332" height="82" rx="10"/>
<text class="h2" x="282" y="212">Server</text>
<text class="sm" x="342.4" y="212">praisonai-mcp</text>
<circle class="dot" cx="288" cy="232" r="2.6"/><text class="tx" x="298" y="236">85 tools ready</text>
<circle class="dot" cx="288" cy="254" r="2.6"/><text class="tx" x="298" y="258">connect &lt;client&gt; writes the config</text>
<path class="wire" d="M190 72 H206 V180 H190"/>
<path class="wire" d="M190 108 H206"/>
<path class="wire" d="M190 144 H206"/>
<path class="flow" d="M206 163 H246"/>
<path class="wire" d="M674 72 H660 V252 H674"/>
<path class="wire" d="M674 108 H660"/>
<path class="wire" d="M674 144 H660"/>
<path class="wire" d="M674 180 H660"/>
<path class="wire" d="M674 216 H660"/>
