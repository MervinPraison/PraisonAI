<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 488" width="880" height="488" role="img" aria-label="How the handover works: a loop of Watch, Test, Hand over, Record and Roll back, moving one task at a time from rented AI to your own AI, built on tracing, evaluation, fine-tuning, model routing and local models">
<style>.bgr{fill:#0d1117}
.eb{font:500 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9198a1;letter-spacing:.12em}
.ebA{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e0b25a;letter-spacing:.12em}
.h1{font:650 22px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
.h2{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
.tx{font:400 13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#c9d1d9}
.sm{font:400 12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#9198a1}
.mono{font:500 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6edf3}
.pill{fill:#161b22;stroke:#3d444d;stroke-width:1}
.pillHi{fill:#2d2716;stroke:#e0b25a;stroke-width:1.2}
.card{fill:#161b22;stroke:#e6edf3;stroke-width:1.4}
.soft{fill:#1c2128;stroke:#3d444d;stroke-width:1}
.dash{fill:none;stroke:#e0b25a;stroke-width:1.4;stroke-dasharray:6 6}
.wire{fill:none;stroke:#3d444d;stroke-width:1.4}
.flow{fill:none;stroke:#e0b25a;stroke-width:1.6;stroke-dasharray:4 10;animation:flow 1.6s linear infinite}
.flowR{fill:none;stroke:#e0b25a;stroke-width:1.6;stroke-dasharray:4 10;animation:flowR 1.6s linear infinite}
.okb{fill:#1f3326} .okt{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8fc39b}
.acb{fill:#3a2f1a} .act{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e0b25a}
.dot{fill:#e0b25a}
@keyframes flow{to{stroke-dashoffset:-28}}
@keyframes flowR{to{stroke-dashoffset:28}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.orbit{fill:none;stroke:#3d444d;stroke-width:1.4}
.orbitF{fill:none;stroke:#e0b25a;stroke-width:2;stroke-dasharray:3 12;animation:flow 1.8s linear infinite}
.node{fill:#161b22;stroke:#e6edf3;stroke-width:1.4}
.nodeBack{fill:#161b22;stroke:#e38d7f;stroke-width:1.6;stroke-dasharray:4 3}
.nodeHi{fill:#2d2716;stroke:#e0b25a;stroke-width:1.6}
.num{font:650 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e0b25a}
.back{fill:none;stroke:#e38d7f;stroke-width:1.6;stroke-dasharray:6 6;animation:flowR 1.6s linear infinite}
.bt{font:600 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e38d7f;letter-spacing:.08em}
.spin{transform-origin:440px 236px;animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<rect class="bgr" x="0" y="0" width="880" height="488" rx="12"/>
<circle class="orbit" cx="440" cy="236" r="150"/>
<circle class="orbitF" cx="440" cy="236" r="150"/>
<g class="spin"><circle class="dot" cx="440" cy="86" r="6"/></g>
<text class="ebA" x="440" y="212" text-anchor="middle">ONE TASK AT A TIME</text>
<text class="h1" x="440" y="240" text-anchor="middle" style="font-size:24px">Rented AI</text>
<text class="sm" x="440" y="260" text-anchor="middle">to</text>
<text class="h1" x="440" y="286" text-anchor="middle" style="font-size:24px">your own AI</text>
<circle class="node" cx="440.0" cy="86.0" r="20"/><text class="num" x="440.0" y="90.0" text-anchor="middle">01</text>
<text class="h2" x="476.0" y="52.0" text-anchor="start">Watch</text><text class="sm" x="476.0" y="70.0" text-anchor="start">Records how each task</text><text class="sm" x="476.0" y="85.0" text-anchor="start">is done today</text>
<circle class="node" cx="582.7" cy="189.6" r="20"/><text class="num" x="582.7" y="193.6" text-anchor="middle">02</text>
<text class="h2" x="614.7" y="181.6" text-anchor="start">Test</text><text class="sm" x="614.7" y="199.6" text-anchor="start">An exam made from real</text><text class="sm" x="614.7" y="214.6" text-anchor="start">past work it never saw</text>
<circle class="nodeHi" cx="528.2" cy="357.4" r="20"/><text class="num" x="528.2" y="361.4" text-anchor="middle">03</text>
<text class="h2" x="560.2" y="349.4" text-anchor="start">Hand over</text><text class="sm" x="560.2" y="367.4" text-anchor="start">The task moves only</text><text class="sm" x="560.2" y="382.4" text-anchor="start">when it passes</text>
<circle class="nodeBack" cx="351.8" cy="357.4" r="20"/><text class="num" x="351.8" y="361.4" text-anchor="middle">04</text>
<text class="h2" x="319.8" y="349.4" text-anchor="end">Roll back</text><text class="sm" x="319.8" y="367.4" text-anchor="end">If quality drops, the task</text><text class="sm" x="319.8" y="382.4" text-anchor="end">moves back automatically</text>
<circle class="node" cx="297.3" cy="189.6" r="20"/><text class="num" x="297.3" y="193.6" text-anchor="middle">05</text>
<text class="h2" x="265.3" y="181.6" text-anchor="end">Record</text><text class="sm" x="265.3" y="199.6" text-anchor="end">Every step leaves a</text><text class="sm" x="265.3" y="214.6" text-anchor="end">record a regulator can check</text>
<line x1="20" y1="436" x2="860" y2="436" style="stroke-dasharray:2 6" class="wire"/>
<text class="eb" x="20" y="466">BUILT ON PARTS LIVE TODAY</text>
<rect class="pill" x="230" y="448" width="75.80000000000001" height="28" rx="14.0"/><text class="tx" x="267.9" y="466.5" text-anchor="middle">Tracing</text>
<rect class="pill" x="315.8" y="448" width="98.0" height="28" rx="14.0"/><text class="tx" x="364.8" y="466.5" text-anchor="middle">Evaluation</text>
<rect class="pill" x="423.8" y="448" width="105.4" height="28" rx="14.0"/><text class="tx" x="476.5" y="466.5" text-anchor="middle">Fine-tuning</text>
<rect class="pill" x="539.2" y="448" width="120.2" height="28" rx="14.0"/><text class="tx" x="599.3000000000001" y="466.5" text-anchor="middle">Model routing</text>
<rect class="pill" x="669.4000000000001" y="448" width="112.80000000000001" height="28" rx="14.0"/><text class="tx" x="725.8000000000001" y="466.5" text-anchor="middle">Local models</text>
</svg>
