              tests/unit/test_editor_output.py tests/unit/test_error_classification.py
              tests/unit/test_error_classifier_jitter.py tests/unit/test_execution_benchmark_rules.py
            # Both tests previously deselected here now pass in combination.
            # test_lazy_litellm_import was looking the loader module up by
            # name and could get a different object than the one get_litellm()
            # mutates; it reads the function's own __globals__ now.
            # test_skills_discovery_uses_paths_module read the real home
            # directory and asserted every discovered dir was named "skills",
            # which is false once a remote skill has ever been cached; it runs
            # against a temp HOME and asserts the paths module is used.
            # Skip strict timings and probes requiring process or service isolation.
            extra_ignore: >-
              --deselect=tests/unit/decisions/test_system_one.py::test_system_one_live_ollama
              --deselect=tests/unit/test_profiling.py::TestZeroOverhead::test_record_timing_overhead
              --deselect=tests/unit/test_profiling.py::TestZeroOverhead::test_phase_context_overhead
              --deselect=tests/unit/test_rate_limiter.py::TestRateLimiterBasic::test_rate_limiter_acquire_sync
              --deselect=tests/unit/test_lazy.py::TestLazyImportPerformance::test_lazy_import_is_fast
              --deselect=tests/unit/test_injected_state.py::TestInjectionZeroOverhead::test_schema_generation_fast
              --deselect=tests/unit/test_parameter_naming.py::TestPerformance::test_import_time_acceptable
              --deselect=tests/unit/test_api_exports.py::TestImportPerformance::test_import_time_under_200ms
              --deselect=tests/unit/test_paths.py::TestImportPerformance::test_import_time_under_10ms
              --deselect=tests/unit/test_paths_wiring.py::TestPolicyConfigWiring::test_default_rules_dir_matches_paths
              --deselect=tests/unit/test_paths_wiring.py::TestSchedulerStoreWiring::test_default_dir_matches_paths
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents
          - shard: train
            workdir: src/praisonai-train
            # tests/unit/data/ (96 tests) was collected by no workflow at all.
            paths: >-
              tests/unit/train/ tests/unit/data/
            extra_ignore: ""
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents:${{ github.workspace }}/src/praisonai-code
          - shard: mcp
            workdir: src/praisonai-mcp
            paths: >-
              tests/mcp_server/
            extra_ignore: ""
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents
          - shard: sandbox
            workdir: src/praisonai-sandbox
            paths: >-
              tests/
            extra_ignore: ""
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents
          - shard: deploy
            workdir: src/praisonai-deploy
            paths: >-
              tests/
            extra_ignore: ""
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents
          - shard: subdirs
            paths: >-
              tests/unit/scheduler/
              tests/unit/integrations/
              tests/unit/mcp/
              tests/unit/knowledge/
              tests/unit/llm/
              tests/unit/doctor/
              tests/unit/code/
              tests/unit/acp/
              tests/unit/agent/
              tests/unit/tools/
              tests/unit/persistence/
              tests/unit/security/
              tests/unit/recipe/
              tests/unit/storage/
              tests/unit/rag/
              tests/unit/replay/
              tests/unit/escalation/
              tests/unit/orchestration/
              tests/unit/dev/
              tests/unit/_dev/
              tests/unit/context/
              tests/unit/adapters/
              tests/unit/templates/
              tests/unit/suite_runner/
              tests/unit/standardise/
            extra_ignore: ""
          - shard: root
            paths: ""
            extra_ignore: ""
            root_glob: "true"
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        cd src/praisonai
        uv pip install --system duckduckgo_search
        uv pip install --system pytest pytest-asyncio pytest-timeout pytest-xdist psutil
        uv pip install --system "praisonaiagents[knowledge]"
    - uses: ./.github/actions/install-monorepo-packages
      with:
        use-uv: "true"
        wrapper-extras: ".[ui,gradio,api,agentops,google,openai,anthropic,cohere,chat,code,realtime,call,crewai,autogen]"
    - name: Set environment variables
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY || 'sk-test-key-for-github-actions-testing-only-not-real' }}" >> $GITHUB_ENV
        echo "OPENAI_API_BASE=${{ secrets.OPENAI_API_BASE || 'https://api.openai.com/v1' }}" >> $GITHUB_ENV
        echo "OPENAI_MODEL_NAME=gpt-4o-mini" >> $GITHUB_ENV
        echo "PYTHONPATH=${{ github.workspace }}/src/praisonai-agents:$PYTHONPATH" >> $GITHUB_ENV
    - name: Run unit shard
      shell: bash
      run: |
        set -euo pipefail
        WORKDIR="${{ matrix.workdir || 'src/praisonai' }}"
        if [ "$WORKDIR" = "src/praisonai-sandbox" ]; then
          bash "$GITHUB_WORKSPACE/scripts/check_c13_sandbox_imports.sh"
        fi
        if [ "$WORKDIR" = "src/praisonai-deploy" ]; then
          bash "$GITHUB_WORKSPACE/scripts/check_c14_deploy_imports.sh"
        fi
        if [ "$WORKDIR" = "src/praisonai-mcp" ]; then
          bash "$GITHUB_WORKSPACE/scripts/check_c12_mcp_imports.sh"
        fi
        cd "$WORKDIR"
        if [ -n "${{ matrix.pythonpath || '' }}" ]; then
          export PYTHONPATH="${{ matrix.pythonpath }}:${PYTHONPATH:-}"
        fi
        PYTEST_ARGS=(
          -m "not slow and not network and not local_service and not provider_anthropic and not provider_google and not provider_ollama and not provider_grok_xai and not provider_groq and not provider_cohere"
          -q --tb=line --disable-warnings
          --timeout=60 -n 2 --dist loadfile
          --ignore=tests/fixtures
          --ignore=tests/e2e
          --ignore=tests/live
          --ignore=tests/unit/test_langflow_components.py
        )
        if [ "${{ matrix.root_glob || 'false' }}" = "true" ]; then
          shopt -s nullglob
          ROOT_TESTS=(tests/unit/test_*.py)
          shopt -u nullglob
          EXCLUDE=(tests/unit/test_langflow_components.py)
          FILTERED=()
          for t in "${ROOT_TESTS[@]}"; do
            skip=false
            for e in "${EXCLUDE[@]}"; do
              if [ "$t" = "$e" ]; then skip=true; break; fi
            done
            if [ "$skip" = false ]; then FILTERED+=("$t"); fi
          done
          if [ ${#FILTERED[@]} -eq 0 ]; then
            echo "No root unit tests matched"
            exit 0
          fi
          python -m pytest "${FILTERED[@]}" "${PYTEST_ARGS[@]}"
        else
          python -m pytest ${{ matrix.paths }} "${PYTEST_ARGS[@]}" ${{ matrix.extra_ignore }}
        fi
    - name: Run isolated thread safety tests
      if: matrix.shard == 'agents-core'
      working-directory: src/praisonai-agents
      run: |
        python -m pytest \
          tests/unit/test_thread_safety.py::TestLiteAgentThreadSafety \
          tests/unit/test_thread_safety.py::TestAgentThreadSafety \
          -m "not slow and not network and not local_service and not provider_anthropic and not provider_google and not provider_ollama and not provider_grok_xai and not provider_groq and not provider_cohere" \
          -q --tb=line --disable-warnings --timeout=60
    - name: Run isolated approval registration test
      if: matrix.shard == 'agents-core'
      working-directory: src/praisonai-agents
      run: |
        python -m pytest tests/unit/test_security_audit_fixes.py::test_ast_grep_rewrite_requires_approval \
          -m "not slow and not network and not local_service and not provider_anthropic and not provider_google and not provider_ollama and not provider_grok_xai and not provider_groq and not provider_cohere" \
          -q --tb=line --disable-warnings --timeout=60
    - name: Run isolated path reload tests
      if: matrix.shard == 'agents-core'
      working-directory: src/praisonai-agents
      run: |
        python -m pytest \
          tests/unit/test_paths_wiring.py::TestPolicyConfigWiring::test_default_rules_dir_matches_paths \
          tests/unit/test_paths_wiring.py::TestSchedulerStoreWiring::test_default_dir_matches_paths \
          -m "not slow and not network and not local_service and not provider_anthropic and not provider_google and not provider_ollama and not provider_grok_xai and not provider_groq and not provider_cohere" \
          -q --tb=line --disable-warnings --timeout=60
    - name: Run isolated timeout-worker tests
      if: matrix.shard == 'agents-core'
      working-directory: src/praisonai-agents
      run: |
        python -m pytest \
          tests/unit/test_async_bridge_invariants.py::test_tool_timeout_uses_daemon_worker_and_does_not_leak \
          tests/unit/test_async_bridge_invariants.py::test_many_concurrent_healthy_timed_calls_are_not_refused \
          tests/unit/test_async_bridge_invariants.py::test_saturated_orphan_pool_reports_capacity_not_timeout \
          -m "not slow and not network and not local_service and not provider_anthropic and not provider_google and not provider_ollama and not provider_grok_xai and not provider_groq and not provider_cohere" \
          -q --tb=line --disable-warnings --timeout=60
    - name: Run isolated placement lifecycle tests
      if: matrix.shard == 'agents-core'
      working-directory: src/praisonai-agents
      run: |
        python -m pytest \
          tests/unit/test_placement.py::test_a_dropped_agent_releases_its_sandbox \
          tests/unit/test_placement.py::test_a_team_run_provisions_exactly_one_sandbox \
          tests/unit/test_placement.py::test_an_async_team_run_provisions_its_sandbox \
          tests/unit/test_placement.py::test_a_batch_shares_one_sandbox_across_every_row \
          -m "not slow and not network and not local_service and not provider_anthropic and not provider_google and not provider_ollama and not provider_grok_xai and not provider_groq and not provider_cohere" \
          -q --tb=line --disable-warnings --timeout=60
    - name: Run isolated lazy import tests
      if: matrix.shard == 'agents-core'
      working-directory: src/praisonai-agents
      run: |
        python -m pytest \
          tests/unit/test_lazy_imports.py::TestLazyImports::test_autonomy_not_loaded_on_agent_import \
          tests/unit/test_lazy_imports.py::TestLazyImports::test_autonomy_config_still_importable_from_feature_configs \
          tests/unit/test_lazy_imports.py::TestLazyImports::test_autonomy_config_lazy_import_matches_tool_search_pattern \
          tests/unit/test_lazy_imports.py::TestLazyImports::test_litellm_not_loaded_on_import \
          tests/unit/test_lazy_imports.py::TestLazyImports::test_requests_not_loaded_on_import \
          tests/unit/test_lazy_imports.py::TestLazyImports::test_agent_available_via_getattr \
          tests/unit/test_lazy_imports.py::TestLazyImports::test_session_available_via_getattr \
          tests/unit/test_lazy_imports.py::TestLazyImports::test_knowledge_available_via_getattr \
          tests/unit/test_lazy_imports.py::TestLazyImports::test_memory_available_via_getattr \
          tests/unit/test_lazy_imports.py::TestLazyImports::test_tools_loaded_eagerly \
          tests/unit/test_lazy_imports.py::TestLitePackage::test_lite_agent_no_litellm \
          tests/unit/test_lazy_imports.py::TestLitePackage::test_lite_agent_with_custom_llm \
          tests/unit/test_lazy_imports.py::TestLazyImports::test_all_exports_accessible \
          -m "not slow and not network and not local_service and not provider_anthropic and not provider_google and not provider_ollama and not provider_grok_xai and not provider_groq and not provider_cohere" \
          -q --tb=line --disable-warnings --timeout=60

