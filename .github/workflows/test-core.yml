              tests/unit/test_provider_matrix.py::test_both_implementations_of_a_vendor_exist_and_are_distinct
              tests/unit/test_provider_matrix.py::test_neither_implementation_passes_megabytes_where_gib_is_wanted
              tests/unit/test_provider_matrix.py::test_e2b_honours_a_non_default_image_as_its_template
