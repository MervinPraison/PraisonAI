              tests/unit/test_provider_matrix.py::test_the_two_docker_implementations_agree_on_their_image
              tests/unit/test_provider_matrix.py::test_every_install_hint_names_an_extra_that_exists
              tests/unit/test_provider_matrix.py::test_managed_ps_polls_places_from_the_registry_not_a_literal
              tests/unit/test_provider_matrix.py::test_a_contributed_place_would_be_polled
              tests/unit/test_provider_matrix.py::test_a_contributed_place_can_name_itself
              tests/unit/test_provider_matrix.py::test_an_unknown_place_still_falls_back_to_its_name
              tests/unit/test_provider_matrix.py::test_sandbox_backends_from_plugins_are_selectable
              tests/unit/test_provider_matrix.py::test_a_plugin_sandbox_reaches_both_parameters
              tests/unit/test_provider_matrix.py::test_every_place_resolves_to_a_provider[local]
              tests/unit/test_provider_matrix.py::test_every_place_resolves_to_a_provider[docker]
              tests/unit/test_provider_matrix.py::test_every_place_resolves_to_a_provider[modal]
              tests/unit/test_provider_matrix.py::test_every_provider_satisfies_the_protocol[local]
              tests/unit/test_provider_matrix.py::test_every_provider_satisfies_the_protocol[docker]
              tests/unit/test_provider_matrix.py::test_every_provider_satisfies_the_protocol[modal]
              tests/unit/test_provider_matrix.py::test_every_protocol_method_is_awaitable[local]
              tests/unit/test_provider_matrix.py::test_every_protocol_method_is_awaitable[docker]
              tests/unit/test_provider_matrix.py::test_every_protocol_method_is_awaitable[modal]
              tests/unit/test_provider_matrix.py::test_every_place_resolves_to_a_provider[daytona]
              tests/unit/test_provider_matrix.py::test_every_place_resolves_to_a_provider[e2b]
              tests/unit/test_provider_matrix.py::test_every_place_resolves_to_a_provider[flyio]
              tests/unit/test_provider_matrix.py::test_every_place_resolves_to_a_provider[novita]
              tests/unit/test_provider_matrix.py::test_every_place_resolves_to_a_provider[sandlock]
              tests/unit/test_provider_matrix.py::test_every_place_resolves_to_a_provider[subprocess]
              tests/unit/test_provider_matrix.py::test_every_place_resolves_to_a_provider[tenki]
              tests/unit/test_provider_matrix.py::test_every_provider_satisfies_the_protocol[daytona]
              tests/unit/test_provider_matrix.py::test_every_provider_satisfies_the_protocol[e2b]
              tests/unit/test_provider_matrix.py::test_every_provider_satisfies_the_protocol[flyio]
              tests/unit/test_provider_matrix.py::test_every_provider_satisfies_the_protocol[novita]
              tests/unit/test_provider_matrix.py::test_every_provider_satisfies_the_protocol[sandlock]
              tests/unit/test_provider_matrix.py::test_every_provider_satisfies_the_protocol[subprocess]
              tests/unit/test_provider_matrix.py::test_every_provider_satisfies_the_protocol[tenki]
              tests/unit/test_provider_matrix.py::test_every_protocol_method_is_awaitable[daytona]
              tests/unit/test_provider_matrix.py::test_every_protocol_method_is_awaitable[e2b]
              tests/unit/test_provider_matrix.py::test_every_protocol_method_is_awaitable[flyio]
              tests/unit/test_provider_matrix.py::test_every_protocol_method_is_awaitable[novita]
              tests/unit/test_provider_matrix.py::test_every_protocol_method_is_awaitable[sandlock]
              tests/unit/test_provider_matrix.py::test_every_protocol_method_is_awaitable[subprocess]
              tests/unit/test_provider_matrix.py::test_every_protocol_method_is_awaitable[tenki]
              tests/unit/test_provider_matrix.py::test_tools_run_on_accepts_every_place[local]
              tests/unit/test_provider_matrix.py::test_tools_run_on_accepts_every_place[docker]
              tests/unit/test_provider_matrix.py::test_tools_run_on_accepts_every_place[modal]
              tests/unit/test_provider_matrix.py::test_tools_run_on_accepts_every_place[daytona]
              tests/unit/test_provider_matrix.py::test_tools_run_on_accepts_every_place[e2b]
              tests/unit/test_provider_matrix.py::test_tools_run_on_accepts_every_place[flyio]
              tests/unit/test_provider_matrix.py::test_tools_run_on_accepts_every_place[novita]
              tests/unit/test_provider_matrix.py::test_tools_run_on_accepts_every_place[sandlock]
              tests/unit/test_provider_matrix.py::test_tools_run_on_accepts_every_place[subprocess]
              tests/unit/test_provider_matrix.py::test_tools_run_on_accepts_every_place[tenki]
              tests/unit/test_provider_matrix.py::test_the_repr_names_the_place_it_was_given[local]
              tests/unit/test_provider_matrix.py::test_the_repr_names_the_place_it_was_given[docker]
              tests/unit/test_provider_matrix.py::test_the_repr_names_the_place_it_was_given[modal]
              tests/unit/test_provider_matrix.py::test_the_repr_names_the_place_it_was_given[daytona]
              tests/unit/test_provider_matrix.py::test_the_repr_names_the_place_it_was_given[e2b]
              tests/unit/test_provider_matrix.py::test_the_repr_names_the_place_it_was_given[flyio]
              tests/unit/test_provider_matrix.py::test_the_repr_names_the_place_it_was_given[novita]
              tests/unit/test_provider_matrix.py::test_the_repr_names_the_place_it_was_given[sandlock]
              tests/unit/test_provider_matrix.py::test_the_repr_names_the_place_it_was_given[subprocess]
              tests/unit/test_provider_matrix.py::test_the_repr_names_the_place_it_was_given[tenki]
              tests/unit/test_provider_matrix.py::test_ssh_explains_that_a_name_is_not_enough
              tests/unit/test_provider_matrix.py::test_native_is_accepted_as_an_alias_for_sandlock
              tests/unit/test_provider_matrix.py::test_availability_can_be_answered_without_raising[local]
              tests/unit/test_provider_matrix.py::test_availability_can_be_answered_without_raising[daytona]
              tests/unit/test_provider_matrix.py::test_availability_can_be_answered_without_raising[e2b]
              tests/unit/test_provider_matrix.py::test_availability_can_be_answered_without_raising[flyio]
              tests/unit/test_provider_matrix.py::test_availability_can_be_answered_without_raising[tenki]
              tests/unit/test_thread_safety.py::TestMCPCleanup
            # Both tests previously deselected here now pass in combination.
            # test_lazy_litellm_import was looking the loader module up by
            # name and could get a different object than the one get_litellm()
            # mutates; it reads the function's own __globals__ now.
            # test_skills_discovery_uses_paths_module read the real home
            # directory and asserted every discovered dir was named "skills",
            # which is false once a remote skill has ever been cached; it runs
            # against a temp HOME and asserts the paths module is used.
            extra_ignore: ""
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents
          - shard: train
            workdir: src/praisonai-train
            # tests/unit/data/ (96 tests) was collected by no workflow at all.
            paths: >-
              tests/unit/train/ tests/unit/data/
            extra_ignore: ""
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents:${{ github.workspace }}/src/praisonai-code
          - shard: mcp
            workdir: src/praisonai-mcp
            paths: >-
              tests/mcp_server/
            extra_ignore: ""
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents
          - shard: sandbox
            workdir: src/praisonai-sandbox
            paths: >-
              tests/
            extra_ignore: ""
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents
          - shard: deploy
            workdir: src/praisonai-deploy
            paths: >-
              tests/
            extra_ignore: ""
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents
          - shard: subdirs
            paths: >-
              tests/unit/scheduler/
              tests/unit/integrations/
              tests/unit/mcp/
              tests/unit/knowledge/
              tests/unit/llm/
              tests/unit/doctor/
              tests/unit/code/
              tests/unit/acp/
              tests/unit/agent/
              tests/unit/tools/
              tests/unit/persistence/
              tests/unit/security/
              tests/unit/recipe/
              tests/unit/storage/
              tests/unit/rag/
              tests/unit/replay/
              tests/unit/escalation/
              tests/unit/orchestration/
              tests/unit/dev/
              tests/unit/_dev/
              tests/unit/context/
              tests/unit/adapters/
              tests/unit/templates/
              tests/unit/suite_runner/
              tests/unit/standardise/
            extra_ignore: ""
          - shard: root
            paths: ""
            extra_ignore: ""
            root_glob: "true"
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        cd src/praisonai
        uv pip install --system duckduckgo_search
        uv pip install --system pytest pytest-asyncio pytest-timeout pytest-xdist
        uv pip install --system "praisonaiagents[knowledge]"
    - uses: ./.github/actions/install-monorepo-packages
      with:
        use-uv: "true"
        wrapper-extras: ".[ui,gradio,api,agentops,google,openai,anthropic,cohere,chat,code,realtime,call,crewai,autogen]"
    - name: Set environment variables
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY || 'sk-test-key-for-github-actions-testing-only-not-real' }}" >> $GITHUB_ENV
        echo "OPENAI_API_BASE=${{ secrets.OPENAI_API_BASE || 'https://api.openai.com/v1' }}" >> $GITHUB_ENV
        echo "OPENAI_MODEL_NAME=gpt-4o-mini" >> $GITHUB_ENV
        echo "PYTHONPATH=${{ github.workspace }}/src/praisonai-agents:$PYTHONPATH" >> $GITHUB_ENV
    - name: Run unit shard
      shell: bash
      run: |
        set -euo pipefail
        WORKDIR="${{ matrix.workdir || 'src/praisonai' }}"
        if [ "$WORKDIR" = "src/praisonai-sandbox" ]; then
          bash "$GITHUB_WORKSPACE/scripts/check_c13_sandbox_imports.sh"
        fi
        if [ "$WORKDIR" = "src/praisonai-deploy" ]; then
          bash "$GITHUB_WORKSPACE/scripts/check_c14_deploy_imports.sh"
        fi
        if [ "$WORKDIR" = "src/praisonai-mcp" ]; then
          bash "$GITHUB_WORKSPACE/scripts/check_c12_mcp_imports.sh"
        fi
        cd "$WORKDIR"
        if [ -n "${{ matrix.pythonpath || '' }}" ]; then
          export PYTHONPATH="${{ matrix.pythonpath }}:${PYTHONPATH:-}"
        fi
        PYTEST_ARGS=(
          -m "not slow and not network and not local_service and not provider_anthropic and not provider_google and not provider_ollama and not provider_grok_xai and not provider_groq and not provider_cohere"
          -q --tb=line --disable-warnings
          --timeout=60 -n 2 --dist loadfile
          --ignore=tests/fixtures
          --ignore=tests/e2e
          --ignore=tests/live
          --ignore=tests/unit/test_langflow_components.py
        )
        if [ "${{ matrix.root_glob || 'false' }}" = "true" ]; then
          shopt -s nullglob
          ROOT_TESTS=(tests/unit/test_*.py)
          shopt -u nullglob
          EXCLUDE=(tests/unit/test_langflow_components.py)
          FILTERED=()
          for t in "${ROOT_TESTS[@]}"; do
            skip=false
            for e in "${EXCLUDE[@]}"; do
              if [ "$t" = "$e" ]; then skip=true; break; fi
            done
            if [ "$skip" = false ]; then FILTERED+=("$t"); fi
          done
          if [ ${#FILTERED[@]} -eq 0 ]; then
            echo "No root unit tests matched"
            exit 0
          fi
          python -m pytest "${FILTERED[@]}" "${PYTEST_ARGS[@]}"
        else
          python -m pytest ${{ matrix.paths }} "${PYTEST_ARGS[@]}" ${{ matrix.extra_ignore }}
        fi

  test-core-integration:
    name: test-core-integration
    needs: test-core-unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        uv pip install --system duckduckgo_search
        uv pip install --system pytest pytest-asyncio pytest-timeout
        uv pip install --system "praisonaiagents[knowledge]"
    - uses: ./.github/actions/install-monorepo-packages
      with:
        use-uv: "true"
        wrapper-extras: ".[ui,gradio,api,agentops,google,openai,anthropic,cohere,chat,code,realtime,call,crewai,autogen]"
    - name: Set environment variables
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY || 'sk-test-key-for-github-actions-testing-only-not-real' }}" >> $GITHUB_ENV
        echo "OPENAI_API_BASE=${{ secrets.OPENAI_API_BASE || 'https://api.openai.com/v1' }}" >> $GITHUB_ENV
        echo "OPENAI_MODEL_NAME=gpt-4o-mini" >> $GITHUB_ENV
        echo "PYTHONPATH=${{ github.workspace }}/src/praisonai-agents:$PYTHONPATH" >> $GITHUB_ENV
    - name: Run integration tests
      shell: bash
      run: |
        set -euo pipefail
        cd src/praisonai
        python -m pytest tests/integration/ \
          -m "not slow and not network and not local_service and not provider_anthropic and not provider_google and not provider_ollama and not provider_grok_xai and not provider_groq and not provider_cohere" \
          -q --tb=line --disable-warnings \
          --timeout=120 \
          --ignore=tests/fixtures \
          --ignore=tests/e2e \
          --ignore=tests/live \
          --ignore=tests/integration/test_tracker_complex_tasks.py \
          --ignore=tests/integration/test_serve_integration.py

  helm-charts:
    name: helm-charts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.14.4
    - name: Lint and template Helm charts
      shell: bash
      run: |
        set -euo pipefail
        bash "$GITHUB_WORKSPACE/scripts/check_helm_charts.sh"

  test-core:
    name: test-core
    needs: [test-core-collect, test-core-unit, test-core-integration, helm-charts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Report Core Tests result
      shell: bash
      run: |
        set -euo pipefail
        collect='${{ needs.test-core-collect.result }}'
        unit='${{ needs.test-core-unit.result }}'
        integration='${{ needs.test-core-integration.result }}'
        helm='${{ needs.helm-charts.result }}'
        echo "collect=$collect unit=$unit integration=$integration helm=$helm"
        if [ "$collect" != "success" ] || [ "$unit" != "success" ] || [ "$integration" != "success" ] || [ "$helm" != "success" ]; then
          echo "Core Tests failed"
          exit 1
        fi
        echo "Core Tests passed"
