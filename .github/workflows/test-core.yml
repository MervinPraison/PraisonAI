name: Core Tests

on:
  push:
    branches: [ main, develop ]
    paths: &watched
      - 'src/praisonai/**'
      - 'src/praisonai-agents/**'
      - 'src/praisonai-code/**'
      - 'src/praisonai-bot/**'
      - 'src/praisonai-train/**'
      - 'src/praisonai-browser/**'
      - 'src/praisonai-mcp/**'
      - 'src/praisonai-sandbox/**'
      - 'src/praisonai-deploy/**'
      # Python tests compare the gateway event types on the wire.
      - 'src/praisonai-ts/src/gateway/index.ts'
      - 'scripts/check_helm_charts.sh'
      - 'scripts/check_c1[234]_*_imports.sh'
      - 'pyproject.toml'
      - '.github/workflows/test-core.yml'
      - '.github/workflows/agents-suite.yml'
      - '.github/actions/install-monorepo-packages/**'
  pull_request:
    branches: [ main, develop ]
    paths: *watched
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONPATH: ${{ github.workspace }}/src/praisonai-agents
  PRAISONAI_ALLOW_NETWORK: '0'
  PRAISONAI_LIVE_TESTS: '0'
  PRAISONAI_TEST_TIER: main
  OPENAI_API_KEY: 'sk-test-key-for-github-actions-testing-only-not-real'
  OPENAI_API_BASE: 'https://api.openai.com/v1'
  OPENAI_MODEL_NAME: gpt-4o-mini
  # litellm reads this at import and, without it, downloads its model-price
  # table from raw.githubusercontent.com before a single test runs -- which
  # made the suite depend on that host being reachable. It has to be set in
  # the environment rather than a conftest, because pytest imports plugins
  # (and litellm with them) before any conftest is loaded.
  LITELLM_LOCAL_MODEL_COST_MAP: 'True'
  HF_HUB_OFFLINE: '1'

jobs:
  agents-suite:
    uses: ./.github/workflows/agents-suite.yml

  test-core-collect:
    name: test-core-collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Install dependencies
      run: uv pip install --system duckduckgo_search pytest pytest-asyncio pytest-timeout pytest-xdist
    - uses: ./.github/actions/install-monorepo-packages
      with:
        use-uv: "true"
        agents-extras: ".[knowledge]"
        wrapper-extras: ".[ui,gradio,api,agentops,google,openai,anthropic,cohere,chat,code,realtime,call,crewai,autogen]"
    - name: Verify unit test collection
      shell: bash
      run: |
        set -euo pipefail
        cd src/praisonai
        python -m pytest tests/unit/ \
          -m "not provider_anthropic and not provider_google and not provider_ollama and not provider_grok_xai and not provider_groq and not provider_cohere" \
          --ignore=tests/fixtures \
          --collect-only -q --disable-warnings

  test-core-unit:
    name: test-core (${{ matrix.shard }})
    needs: test-core-collect
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: cli
            paths: >-
              tests/unit/cli/
              tests/unit/tui/
          - shard: code
            workdir: src/praisonai-code
            paths: tests/unit/
          - shard: bots-gateway
            workdir: src/praisonai-bot
            paths: tests/unit/
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents:${{ github.workspace }}/src/praisonai-code
          - shard: train
            workdir: src/praisonai-train
            paths: tests/unit/
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents:${{ github.workspace }}/src/praisonai-code
          - shard: mcp
            workdir: src/praisonai-mcp
            paths: >-
              tests/mcp_server/
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents
          - shard: sandbox
            workdir: src/praisonai-sandbox
            paths: >-
              tests/
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents
          - shard: deploy
            workdir: src/praisonai-deploy
            paths: >-
              tests/
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents
          - shard: subdirs
          - shard: root
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Install dependencies
      run: uv pip install --system duckduckgo_search pytest pytest-asyncio pytest-timeout pytest-xdist psutil
    - uses: ./.github/actions/install-monorepo-packages
      with:
        use-uv: "true"
        agents-extras: ".[knowledge]"
        wrapper-extras: ".[ui,gradio,api,agentops,google,openai,anthropic,cohere,chat,code,realtime,call,crewai,autogen]"
    - name: Install the TypeScript parser for parity fixtures
      if: matrix.shard == 'subdirs'
      run: |
        npm install --prefix "$RUNNER_TEMP/parity-ts" --no-audit --no-fund typescript@5.7.3
        echo "PARITY_TS_NODE_MODULES=$RUNNER_TEMP/parity-ts/node_modules" >> "$GITHUB_ENV"
    - name: Run unit shard
      shell: bash
      run: |
        set -euo pipefail
        WORKDIR="${{ matrix.workdir || 'src/praisonai' }}"
        if [ "$WORKDIR" = "src/praisonai-sandbox" ]; then
          bash "$GITHUB_WORKSPACE/scripts/check_c13_sandbox_imports.sh"
        fi
        if [ "$WORKDIR" = "src/praisonai-deploy" ]; then
          bash "$GITHUB_WORKSPACE/scripts/check_c14_deploy_imports.sh"
        fi
        if [ "$WORKDIR" = "src/praisonai-mcp" ]; then
          bash "$GITHUB_WORKSPACE/scripts/check_c12_mcp_imports.sh"
        fi
        cd "$WORKDIR"
        if [ -n "${{ matrix.pythonpath || '' }}" ]; then
          export PYTHONPATH="${{ matrix.pythonpath }}:${PYTHONPATH:-}"
        fi
        PYTEST_ARGS=(
          -m "not slow and not network and not local_service and not provider_anthropic and not provider_google and not provider_ollama and not provider_grok_xai and not provider_groq and not provider_cohere"
          -q --tb=line --disable-warnings
          --timeout=60 -n 2 --dist loadfile --durations=10
          --ignore=tests/fixtures
          --ignore=tests/e2e
          --ignore=tests/live
          --ignore=tests/unit/test_langflow_components.py
        )
        shopt -s nullglob
        case "${{ matrix.shard }}" in
          root)
            TESTS=()
            for test_file in tests/unit/test_*.py; do
              if [[ "$test_file" != tests/unit/test_langflow_components.py ]]; then
                TESTS+=("$test_file")
              fi
            done
            ;;
          subdirs)
            TESTS=()
            for test_dir in tests/unit/*/; do
              case "$test_dir" in
                tests/unit/cli/|tests/unit/tui/|*/__pycache__/) ;;
                *) TESTS+=("$test_dir") ;;
              esac
            done
            ;;
          *)
            TESTS=(${{ matrix.paths }})
            ;;
        esac
        if (( ${#TESTS[@]} == 0 )); then
          echo "No tests matched the ${{ matrix.shard }} shard" >&2
          exit 1
        fi
        python -m pytest "${TESTS[@]}" "${PYTEST_ARGS[@]}"

  test-core-integration:
    name: test-core-integration
    needs: test-core-collect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Install dependencies
      run: uv pip install --system duckduckgo_search pytest pytest-asyncio pytest-timeout
    - uses: ./.github/actions/install-monorepo-packages
      with:
        use-uv: "true"
        agents-extras: ".[knowledge]"
        wrapper-extras: ".[ui,gradio,api,agentops,google,openai,anthropic,cohere,chat,code,realtime,call,crewai,autogen]"
    - name: Run integration tests
      shell: bash
      run: |
        set -euo pipefail
        cd src/praisonai
        python -m pytest tests/integration/ \
          -m "not slow and not network and not local_service and not provider_anthropic and not provider_google and not provider_ollama and not provider_grok_xai and not provider_groq and not provider_cohere" \
          -q --tb=line --disable-warnings \
          --timeout=120 \
          --ignore=tests/fixtures \
          --ignore=tests/e2e \
          --ignore=tests/live \
          --ignore=tests/integration/test_tracker_complex_tasks.py \
          --ignore=tests/integration/test_serve_integration.py

  helm-charts:
    name: helm-charts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Setup Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.14.4
    - name: Lint and template Helm charts
      shell: bash
      run: |
        set -euo pipefail
        bash "$GITHUB_WORKSPACE/scripts/check_helm_charts.sh"

  test-core:
    name: test-core
    needs: [agents-suite, test-core-collect, test-core-unit, test-core-integration, helm-charts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Report Core Tests result
      shell: bash
      run: |
        set -euo pipefail
        agents='${{ needs.agents-suite.result }}'
        collect='${{ needs.test-core-collect.result }}'
        unit='${{ needs.test-core-unit.result }}'
        integration='${{ needs.test-core-integration.result }}'
        helm='${{ needs.helm-charts.result }}'
        echo "agents=$agents collect=$collect unit=$unit integration=$integration helm=$helm"
        if [ "$agents" != "success" ] || [ "$collect" != "success" ] || [ "$unit" != "success" ] || [ "$integration" != "success" ] || [ "$helm" != "success" ]; then
          echo "Core Tests failed"
          exit 1
        fi
        echo "Core Tests passed"
