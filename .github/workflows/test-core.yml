name: Core Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'src/praisonai-deploy/infra/**'
      - 'src/praisonai-bot/infra/**'
      - 'scripts/check_helm_charts.sh'
      - 'pyproject.toml'
      - '.github/workflows/test-core.yml'
      - '.github/actions/install-monorepo-packages/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'src/praisonai-deploy/infra/**'
      - 'src/praisonai-bot/infra/**'
      - 'scripts/check_helm_charts.sh'
      - 'pyproject.toml'
      - '.github/workflows/test-core.yml'
      - '.github/actions/install-monorepo-packages/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}/src/praisonai-agents
  PRAISONAI_ALLOW_NETWORK: '0'
  PRAISONAI_LIVE_TESTS: '0'
  PRAISONAI_TEST_TIER: main
  # litellm reads this at import and, without it, downloads its model-price
  # table from raw.githubusercontent.com before a single test runs -- which
  # made the suite depend on that host being reachable. It has to be set in
  # the environment rather than a conftest, because pytest imports plugins
  # (and litellm with them) before any conftest is loaded.
  LITELLM_LOCAL_MODEL_COST_MAP: 'True'
  HF_HUB_OFFLINE: '1'

jobs:
  test-core-collect:
    name: test-core-collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install UV
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    - name: Install dependencies
      run: |
        cd src/praisonai
        uv pip install --system duckduckgo_search
        uv pip install --system pytest pytest-asyncio pytest-timeout pytest-xdist
        uv pip install --system "praisonaiagents[knowledge]"
    - uses: ./.github/actions/install-monorepo-packages
      with:
        use-uv: "true"
        wrapper-extras: ".[ui,gradio,api,agentops,google,openai,anthropic,cohere,chat,code,realtime,call,crewai,autogen]"
    - name: Set environment variables
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY || 'sk-test-key-for-github-actions-testing-only-not-real' }}" >> $GITHUB_ENV
        echo "OPENAI_API_BASE=${{ secrets.OPENAI_API_BASE || 'https://api.openai.com/v1' }}" >> $GITHUB_ENV
        echo "OPENAI_MODEL_NAME=gpt-4o-mini" >> $GITHUB_ENV
        echo "PYTHONPATH=${{ github.workspace }}/src/praisonai-agents:$PYTHONPATH" >> $GITHUB_ENV
    - name: Verify unit test collection
      shell: bash
      run: |
        set -euo pipefail
        cd src/praisonai
        python -m pytest tests/unit/ \
          -m "not provider_anthropic and not provider_google and not provider_ollama and not provider_grok_xai and not provider_groq and not provider_cohere" \
          --ignore=tests/fixtures \
          --collect-only -q --disable-warnings

  test-core-unit:
    name: test-core (${{ matrix.shard }})
    needs: test-core-collect
    runs-on: ubuntu-latest
    # agents-core runs the full praisonai-agents unit tree and often nears 30m;
    # GitHub cancels at the limit and forces a full rerun (+ stale-FINAL churn).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: cli
            paths: >-
              tests/unit/cli/
              tests/unit/tui/
            extra_ignore: --ignore=tests/unit/cli/test_message_queue.py
          - shard: bots-gateway
            workdir: src/praisonai-bot
            # tests/unit/test_bots_cli.py sat at the top level and was collected
            # by no workflow at all, which is why a TypeError that made
            # `praisonai bot slack` unstartable shipped unnoticed. Named
            # explicitly rather than adding the whole top-level directory, which
            # carries suites with pre-existing env-dependent failures.
            # tests/unit/kanban/ was likewise collected by no workflow, which
            # is how six declared KANBAN_TASK_* hook events shipped with no
            # emitter at all.
            paths: >-
              tests/unit/bots/
              tests/unit/gateway/
              tests/unit/cli/
              tests/unit/daemon/
              tests/unit/kanban/
              tests/unit/test_bots_cli.py
            extra_ignore: ""
            pythonpath: >-
              ${{ github.workspace }}/src/praisonai-agents:${{ github.workspace }}/src/praisonai-code
          - shard: agents-core
            workdir: src/praisonai-agents
            # src/praisonai-agents/tests holds 727 files and 11,437 test
            # functions, and until now NO workflow referenced the directory at
            # all -- so the LLM layer, the provider adapters, the local-model
            # package and the streaming paths were guarded by tests that never
            # ran. Nearly every defect found in the recent local-model audits
            # had a working test sitting unused beside it.
            #
            # The ten directories originally left out of this shard (knowledge,
            # runtime, session, tools, bus, plugins, skills, agents, rag,
            # streaming -- about 52 failures) have since been repaired, so they
            # are all listed below: 1,567 tests in the seven added here alone.
            # Leaving them out would have meant the repairs were never exercised.
            #
            # The whole tree in one invocation was hanging. The cause was NOT
            # the pytest-rerunfailures run_server thread guessed at here
            # earlier: it is test_botos_integration.py, where a supervised
            # Bot.start() deliberately never returns and the mock adapter
            # reports is_running=True forever (fixed on this branch). Naming
            # directories explicitly is still the safer shape for a shard.
            paths: >-
              tests/unit/agent/ tests/unit/app/ tests/unit/approval/
              tests/unit/auth/ tests/unit/background/ tests/unit/checkpoints/
