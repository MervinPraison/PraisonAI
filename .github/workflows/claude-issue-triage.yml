name: Claude Issue Triage
description: "Automatically triage GitHub issues using Claude Code"

on:
  workflow_dispatch:
#   issues:
#     types: [opened]

jobs:
  triage-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Pick Claude OAuth token
        id: oauth
        uses: MervinPraison/github-automation-template/.github/actions/pick-oauth-token@v1.1.9
        with:
          token_primary: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          token_secondary: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
          active_slot: ${{ vars.CLAUDE_OAUTH_ACTIVE != '' && vars.CLAUDE_OAUTH_ACTIVE || 'primary' }}

      - name: Run Claude Issue Triage
        uses: ./.github/actions/claude-issue-triage-action
        with:
          claude_code_oauth_token: ${{ steps.oauth.outputs.token }}
          github_token: ${{ steps.app-token.outputs.token }} 