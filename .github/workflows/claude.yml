name: Claude Assistant

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Fix an issue or review a PR
        type: choice
        required: true
        options: [fix-issue, review-pr]
      number:
        description: Issue or PR number
        type: string
        required: true
      instructions:
        description: Optional instructions for Claude
        type: string
      validation:
        description: Optional test command for the issue fix, run without Claude or write credentials
        type: string

permissions: {}

concurrency:
  group: claude-owner-${{ inputs.mode }}-${{ inputs.number }}
  cancel-in-progress: false

env:
  CLAUDE_MODE: ${{ inputs.mode }}
  TARGET_NUMBER: ${{ inputs.number }}

jobs:
  prepare:
    # Check both identities because a re-run retains the original actor.
    if: >-
      github.repository == 'MervinPraison/PraisonAI' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'MervinPraison' &&
      github.actor_id == '454862' &&
      github.triggering_actor == 'MervinPraison'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    outputs:
      publish: ${{ steps.stage.outputs.publish }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      artifact: ${{ steps.context.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare trusted policy and target context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_INSTRUCTIONS: ${{ inputs.instructions }}
        run: |
          bash .github/scripts/claude-owner.sh prepare

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.332

      - name: Pick Claude OAuth token
        id: oauth
        uses: ./.github/actions/pick-oauth-token
        with:
          token_primary: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          token_secondary: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_B }}
          token_tertiary: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_C }}
          active_slot: ${{ vars.CLAUDE_OAUTH_ACTIVE }}

      - name: Run Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.oauth.outputs.token }}
        run: bash .github/scripts/claude-owner.sh run

      - name: Stage review or patch
        id: stage
        run: bash .github/scripts/claude-owner.sh stage

      - uses: actions/upload-artifact@v4
        if: steps.stage.outputs.publish == 'true'
        with:
          name: ${{ steps.context.outputs.artifact }}
          path: ${{ runner.temp }}/claude-handoff/publish/
          if-no-files-found: error
          retention-days: 1

  verify-fix:
    needs: prepare
    if: >-
      github.triggering_actor == 'MervinPraison' &&
      inputs.mode == 'fix-issue' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/claude-handoff/publish

      - name: Check the patch and run maintainer-provided validation
        env:
          VALIDATION_COMMAND: ${{ inputs.validation }}
        run: bash .github/scripts/claude-owner.sh verify-fix

  publish-review:
    needs: prepare
    if: >-
      github.triggering_actor == 'MervinPraison' &&
      inputs.mode == 'review-pr' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/claude-handoff/publish

      - name: Post advisory review on the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_HEAD: ${{ needs.prepare.outputs.head_sha }}
        run: bash .github/scripts/claude-owner.sh publish-review

  publish-fix:
    needs: [prepare, verify-fix]
    if: >-
      github.triggering_actor == 'MervinPraison' &&
      inputs.mode == 'fix-issue' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: ${{ runner.temp }}/claude-handoff/publish

      - name: Open draft fix PR
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VALIDATION_RAN: ${{ inputs.validation != '' }}
        run: bash .github/scripts/claude-owner.sh publish-fix
