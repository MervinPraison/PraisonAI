name: Update Feature Parity Tracker

# Regenerates the exported-name parity trackers on push to main and commits them.
# Validation on pull requests (fail on drift) lives in parity-gate.yml.

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/praisonai-agents/praisonaiagents/**/*.py'
      - 'src/praisonai-ts/src/**/*.ts'
      # The crate lives at src/praisonai-rust/praisonai/src -- the old
      # 'src/praisonai-rust/src/**' path does not exist, so a Rust change
      # never triggered either tracker and the Rust numbers only ever
      # refreshed incidentally, on an unrelated push.
      - 'src/praisonai-rust/praisonai/src/**/*.rs'
      # The generator's own code and the wrapper features it counts. Change
      # either and nothing regenerated until an unrelated push landed.
      - 'src/praisonai/praisonai/_dev/parity/**/*.py'
      - 'src/praisonai/praisonai/cli/features/**/*.py'
      - '.github/workflows/update-parity-tracker.yml'
permissions:
  contents: write

jobs:
  update-parity-tracker:
    # Push only. On a PR the parity-gate.yml `names` job CHECKS instead --
    # committing a regenerated tracker onto a contributor's branch is not this
    # workflow's business, and would fail on a fork besides.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main
        persist-credentials: true
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install pyyaml

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install the TypeScript compiler only
      # The signature extractor needs `typescript` and nothing else;
      # praisonai-ts's own dependency tree does not install cleanly.
      run: |
        mkdir -p "$RUNNER_TEMP/parity-ts"
        npm install --prefix "$RUNNER_TEMP/parity-ts" --no-audit --no-fund typescript@5.7.3
        echo "PARITY_TS_NODE_MODULES=$RUNNER_TEMP/parity-ts/node_modules" >> "$GITHUB_ENV"

    - name: Generate parity trackers
      run: |
        cd $GITHUB_WORKSPACE
        python3 src/praisonai/scripts/generate_parity_tracker.py

    - name: Regenerate the signature report
      # Source locations in the report drift whenever a covered file is edited.
      # The pull-request gate ignores line-number-only drift so it never reddens
      # a build over it; refreshing here keeps the committed line numbers true.
      env:
        PYTHONPATH: src/praisonai
      run: |
        cd $GITHUB_WORKSPACE
        python3 -m praisonai._dev.parity.signatures --write

    - name: Regenerate the behaviour report
      env:
        PYTHONPATH: src/praisonai
      run: |
        cd $GITHUB_WORKSPACE
        python3 -m praisonai._dev.parity.behaviour --write

    - name: Check for changes
      id: check_changes
      run: |
        if git diff --quiet src/praisonai-ts/FEATURE_PARITY_TRACKER.json src/praisonai-ts/PARITY.md src/praisonai-rust/FEATURE_PARITY_TRACKER.json src/praisonai-rust/PARITY.md src/praisonai-ts/SIGNATURE_PARITY.md src/praisonai-ts/signature-parity.json src/praisonai-ts/BEHAVIOUR_PARITY.md src/praisonai-ts/behaviour-parity.json 2>/dev/null; then
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "No changes to parity trackers"
        else
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Parity trackers have been updated"
          git diff src/praisonai-ts/FEATURE_PARITY_TRACKER.json | head -50
        fi

    - name: Commit and push changes
      if: steps.check_changes.outputs.changes == 'true'
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "docs: auto-update feature parity trackers [skip ci]"
        file_pattern: 'src/praisonai-ts/FEATURE_PARITY_TRACKER.json src/praisonai-ts/PARITY.md src/praisonai-rust/FEATURE_PARITY_TRACKER.json src/praisonai-rust/PARITY.md src/praisonai-ts/SIGNATURE_PARITY.md src/praisonai-ts/signature-parity.json src/praisonai-ts/BEHAVIOUR_PARITY.md src/praisonai-ts/behaviour-parity.json'
        commit_user_name: "MervinPraison"
        commit_user_email: "454862+MervinPraison@users.noreply.github.com"
        commit_author: "MervinPraison <454862+MervinPraison@users.noreply.github.com>"
