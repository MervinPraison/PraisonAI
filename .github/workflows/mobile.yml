# The mobile package's tests.
#
# Written at the same time as the package, deliberately. praisonai-desktop's
# suite existed and ran nowhere for months because no workflow referenced it,
# and a package whose tests never run in CI is a package whose tests are
# decoration -- the 523 here would go stale silently.
#
# Four gates, and they catch different things:
#
#   typecheck   -- the boundary between erasable and non-erasable TypeScript.
#                  node:test strips types rather than compiling, so an enum or
#                  a constructor parameter property is a runtime parse error at
#                  import; `erasableSyntaxOnly` turns that into a typecheck
#                  failure at the file that caused it.
#   boundaries  -- the two seams. Only engines/src/praisonai-ts may import
#                  'praisonai'; only adapters/src/tauri may import @tauri-apps.
#                  These are the whole reason the package is swappable, and a
#                  rule enforced only by review stops being enforced.
#   test        -- the suite itself.
#   bundle gate -- webview compatibility. This is the one a normal test run
#                  CANNOT do: node:test runs in Node, where a `crypto` import
#                  and a top-level `process.env` both work fine, and both kill
#                  a webview bundle at import time.
name: mobile

on:
  push:
    branches: [main]
    paths: &watched
      - 'src/praisonai-mobile/**'
      - '.github/workflows/mobile.yml'
      # The `upstream parity` job below typechecks the REAL praisonai-ts Agent
      # against the structural contract in engines/src/praisonai-ts/agent-api.ts.
      # Watching only praisonai-mobile made that gate fire when the CONSUMER
      # changed and stay silent when the thing it watches did -- so upstream
      # drift landed on main unchecked. Verified on 71197fa80, which edited
      # src/praisonai-ts/src/agent/simple.ts: no parity check ran on it.
      - 'src/praisonai-ts/src/**'
  pull_request:
    paths: *watched

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/praisonai-mobile

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 22.18 is the floor declared in package.json -- tested because a
        # declared floor nobody runs is a guess. 24 is the forward check:
        # native type-stripping is the feature this package depends on most,
        # and it is exactly the kind of thing a major bump changes.
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: src/praisonai-mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Layer boundaries
        run: npm run boundaries
      - name: Tests
        run: npm test
      - name: Bundle gate fixtures
        # Runs the gate's own suite, which proves each check can FAIL -- a
        # build check that has only ever seen clean input is a check nobody
        # knows the state of.
        run: npm run test:bundle

  upstream-parity:
    name: upstream parity
    # Its own job so drift from the real Agent is visible in the checks list
    # rather than buried in another job's log.
    #
    # It needs only THIS package's install. praisonai-ts's own dependencies are
    # neither needed nor installable -- `npm install` there fails with an
    # ERESOLVE peer conflict (bedrock-agentcore -> @strands-agents/sdk) -- and
    # every member the check looks at is declared locally in simple.ts. That is
    # verified rather than assumed: with praisonai-ts's node_modules moved
    # aside, injected drift is still caught as TS2741.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: src/praisonai-mobile/package-lock.json
      - run: npm ci
      - name: Does the real Agent still satisfy PraisonAgent?
        # Skips loudly if the praisonai-ts checkout is missing, rather than
        # passing quietly -- a check that silently stops covering anything is
        # worse than no check.
        run: npm run check:upstream

  shell:
    name: rust shell (${{ matrix.os }})
    # The Rust crate had 14 tests and no job running them -- the same failure
    # this workflow's header says it was created to prevent, one language over.
    #
    # Both platforms, because the crate is cfg-heavy: the back-gesture fallback
    # is #[cfg(target_os = "android")] / ios / not(mobile), and a cfg mistake
    # compiles perfectly on whichever host you happened to try.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    defaults:
      run:
        working-directory: src/praisonai-mobile/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: src/praisonai-mobile/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/praisonai-mobile/src-tauri
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      # generate_context! expands frontendDist (../dist) at COMPILE time, and
      # dist/ is gitignored -- absent on a fresh checkout. Without this the
      # crate cannot compile and neither test nor clippy below ever runs.
      - name: Build the webview (creates ../dist for generate_context!)
        working-directory: src/praisonai-mobile
        run: |
          npm ci
          npm run build
      # The pure-logic tests: back-gesture arbitration, the lifecycle mapping,
      # and the event-name contract. None of them needs a phone.
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # ------------------------------------------------------------------
  # The mobile targets, which nothing compiled.
  #
  # `src/lib.rs` is `#[cfg_attr(mobile, tauri::mobile_entry_point)]`, and
  # `tauri_build::build()` emits `cargo:rustc-cfg=mobile` only for android and
  # ios targets. Both legs of `rust shell` above are HOST targets, so that
  # attribute -- the one that generates the Android JNI symbol and the iOS
  # start_app symbol -- expanded exactly zero times in CI, and neither did the
  # `#[cfg(target_os = "android")]` / `ios` arms of `commands.rs`. The job
  # above says it covers cfg mistakes; it covers the ones in `shell/`, not
  # these.
  #
  # `cargo check`, not `build`: it type-checks and macro-expands under the
  # mobile cfg, which is the thing that was never done, and needs no NDK and no
  # Xcode project. Verified at 18s for the android target.
  # ------------------------------------------------------------------
  cross-check:
    name: cross-check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            os: ubuntu-22.04
          - target: aarch64-apple-ios
            os: macos-15
    defaults:
      run:
        working-directory: src/praisonai-mobile/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: src/praisonai-mobile/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/praisonai-mobile/src-tauri
          key: ${{ matrix.target }}
      # generate_context! expands frontendDist at COMPILE time and dist/ is
      # gitignored, so the crate cannot be checked without this -- the same
      # reason the job above needs it.
      - name: Build the webview (creates ../dist for generate_context!)
        working-directory: src/praisonai-mobile
        run: |
          npm ci
          npm run build
      - name: Does the crate still expand and type-check for a phone?
        run: cargo check --lib --target ${{ matrix.target }}
