[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praisonai-mrscraper-example"
version = "0.1.0"
description = "MrScraper client and PraisonAI callable tools example"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25,<1"]

[tool.setuptools.package-data]
praisonai_mrscraper = ["structured_data_prompts.json"]
