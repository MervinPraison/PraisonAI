# Benchmark environment for "praisonai_release". Not a package: run.py syncs it with
# `uv sync` and runs the probes with its interpreter. The weekly job
# refreshes uv.lock (`uv lock --upgrade`) in the results PR.
[project]
name = "bench-praisonai-release"
version = "0"
requires-python = "==3.12.*"
dependencies = ["praisonaiagents"]

[tool.uv]
package = false

