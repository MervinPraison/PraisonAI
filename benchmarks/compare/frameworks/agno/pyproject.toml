# Benchmark environment for "agno". Not a package: run.py syncs it with
# `uv sync` and runs the probes with its interpreter. The weekly job
# refreshes uv.lock (`uv lock --upgrade`) in the results PR.
[project]
name = "bench-agno"
version = "0"
requires-python = "==3.12.*"
dependencies = ["agno>=2.0", "openai>=1.68"]

[tool.uv]
package = false

