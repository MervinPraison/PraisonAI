# Benchmark environment for "crewai". Not a package: run.py syncs it with
# `uv sync` and runs the probes with its interpreter. The weekly job
# refreshes uv.lock (`uv lock --upgrade`) in the results PR.
[project]
name = "bench-crewai"
version = "0"
requires-python = "==3.12.*"
dependencies = ["crewai>=1.0"]

[tool.uv]
package = false

