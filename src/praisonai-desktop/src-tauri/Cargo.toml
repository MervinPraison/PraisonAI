[package]
name = "praisonai-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PraisonAI desktop shell."

[lib]
name = "praisonai_desktop_core"
path = "src/lib.rs"

[[bin]]
name = "praisonai-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# The window came up at the configured 980x720 on every launch, discarding
# whatever size and position the user had chosen.
tauri-plugin-window-state = "2"
# Without this a second launch starts a second shell against the same lockfile,
# and the two race over one engine.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Size profile: measured at 8.27 MB default -> 2.99 MB with these five lines.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
