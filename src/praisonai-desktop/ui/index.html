/** Grow the composer with its content, up to the CSS max-height. */
function autosize(){
  box.style.height='auto';
  box.style.height=Math.min(box.scrollHeight,MAX_COMPOSER_PX)+'px';
}
const MAX_COMPOSER_PX=160;
box.addEventListener('input',autosize);
/** Set the composer's text from code. Assigning `.value` fires no input
 *  event, so every programmatic path has to resize explicitly or the box stays
 *  whatever height the last typed character left it. */
function setComposer(text){ box.value=text; autosize(); }

// Keyboard shortcuts matching the references.
document.addEventListener('keydown',e=>{
  if(!(e.metaKey||e.ctrlKey)) return;
  if(e.key==='n'){ e.preventDefault(); newChat.click(); }
  else if(e.key==='k'){ e.preventDefault(); document.getElementById('search').click(); }
  else if(e.key===','){ e.preventDefault(); document.getElementById('settings').click(); }
  else if(e.key==='b'){ e.preventDefault(); document.getElementById('toggle').click(); }
  // Zoom drives the same text-size setting the Appearance panel does, so the
  // keyboard and the settings screen can never disagree about the current size.
  else if(e.key==='='||e.key==='+'){ e.preventDefault(); stepTextSize(+1); }
  else if(e.key==='-'||e.key==='_'){ e.preventDefault(); stepTextSize(-1); }
  else if(e.key==='0'){ e.preventDefault(); setTextSize(BASE_TEXT_PX); }
});

/** The sizes the Appearance control offers, so both paths stay in step. */
function textSizes(){
  const def=SETTINGS.find(d=>d.key==='font_size');
  return def.control.options.map(o=>Number(o.value));
}
function setTextSize(px){
  saveCfg({font_size:px});
  toast('Text size '+px+' px');
}
function stepTextSize(dir){
  const sizes=textSizes();
  const now=Number(CFG.font_size)||BASE_TEXT_PX;
  let i=sizes.indexOf(now);
  if(i<0){ i=sizes.reduce((best,v,k)=>
    Math.abs(v-now)<Math.abs(sizes[best]-now)?k:best,0); }
  const next=sizes[Math.min(sizes.length-1,Math.max(0,i+dir))];
  if(next!==now) setTextSize(next);
}


// ---- settings panel, rendered entirely from the registry ----
let cfg = {};
const cfgGet = k => (k in cfg ? cfg[k] : DEFAULTS[k]);

async function saveCfg(patch){
  CFG={...CFG,...patch}; applyPrefs(CFG);
  cfg = {...cfg, ...patch};
  await fetch('http://127.0.0.1:'+PORT+'/settings',{method:'POST',
    headers:{'content-type':'application/json'},body:JSON.stringify(patch)});
}

function control(def, onChange){
  const c = def.control, v = cfgGet(def.key), wrap = document.createElement('div');
  wrap.className = 'srow-ctl';
  const set = nv => onChange(nv);
  if (c.kind === 'toggle'){
    const sw = document.createElement('div');
    sw.className = 'sw' + (v ? ' on' : ''); sw.innerHTML = '<i></i>';
    sw.onclick = () => set(!cfgGet(def.key));
    wrap.appendChild(sw);
  } else if (c.kind === 'segmented'){
    const g = document.createElement('div'); g.className = 'seg';
    c.options.forEach(o => { const b = document.createElement('button');
      b.type='button'; b.textContent=o.label; b.className = o.value===v?'on':'';
      b.onclick = () => set(o.value); g.appendChild(b); });
    wrap.appendChild(g);
  } else if (c.kind === 'select'){
    const sel = document.createElement('select');
    c.options.forEach(o => { const op=document.createElement('option');
      op.value=String(o.value); op.textContent=o.label; sel.appendChild(op); });
    sel.value = String(v);
    sel.onchange = () => { const o=c.options.find(x=>String(x.value)===sel.value); set(o.value); };
    wrap.appendChild(sel);
  } else if (c.kind === 'slider'){
    const r=document.createElement('input'); r.type='range';
    r.min=c.min; r.max=c.max; r.step=c.step; r.value=v; r.style.width='110px';
    const n=document.createElement('span'); n.style.cssText='font-size:.78rem;min-width:30px;text-align:right';
    n.textContent=v;
    r.oninput=()=>{n.textContent=r.value;}; r.onchange=()=>set(Number(r.value));
    wrap.append(r,n);
  } else if (c.kind === 'number'){
    const i=document.createElement('input'); i.type='number';
    if(c.min!=null)i.min=c.min; if(c.max!=null)i.max=c.max; if(c.step)i.step=c.step;
    i.value=v; i.onchange=()=>set(i.value===''?'':Number(i.value));
    wrap.appendChild(i);
  } else if (c.kind === 'combobox'){
    const i=document.createElement('input'); i.type='text'; i.value=v??'';
    i.setAttribute('list','dl-'+def.key);
    const dl=document.createElement('datalist'); dl.id='dl-'+def.key;
    (typeof c.suggestions==='function'?c.suggestions(cfgGet):c.suggestions)
      .forEach(x=>{const o=document.createElement('option');o.value=x;dl.appendChild(o);});
    i.onchange=()=>set(i.value);
    wrap.append(i,dl);
  } else if (c.kind === 'action'){
    const b=document.createElement('button');
    b.type='button'; b.className='ghost'; b.textContent=c.verb;
    if(c.danger) b.style.borderColor='var(--bad)', b.style.color='var(--bad)';
    b.onclick=()=>runAction(def);
    wrap.appendChild(b);
  } else if (c.kind === 'readout'){
    const t=document.createElement('span');
    t.style.cssText='font-size:.82rem;color:var(--soft);font-family:ui-monospace,Menlo,monospace';
    t.textContent=c.value({engine:PORT?('127.0.0.1:'+PORT):null});
    wrap.appendChild(t);
  } else if (c.kind === 'text' && !c.multiline){
    const i=document.createElement('input'); i.type=c.secret?'password':'text';
    i.value=v??''; if(c.placeholder)i.placeholder=c.placeholder;
    i.onchange=()=>set(i.value);
    wrap.appendChild(i);
  }
  return wrap;
}

async function runAction(def){
  if(def.confirm && !await askConfirm(def.confirm.message,{ok:'Continue'})) return;
  if(def.action==='export'){
    const {chats}=await (await fetch('http://127.0.0.1:'+PORT+'/chats')).json();
    const all=[];
    for(const c of chats) all.push(await (await fetch('http://127.0.0.1:'+PORT+'/chats/'+c.id)).json());
    // A sandboxed webview blocks a download the page starts itself, so the
    // export goes to the clipboard and says so rather than failing silently.
    await navigator.clipboard.writeText(JSON.stringify(all,null,2));
    toast(all.length+' conversation(s) copied as JSON. Paste into a file to save.');
    closeOverlay();
  } else if(def.action==='clear'){
    const {chats}=await (await fetch('http://127.0.0.1:'+PORT+'/chats')).json();
    for(const c of chats) await fetch('http://127.0.0.1:'+PORT+'/chats/'+c.id,{method:'DELETE'});
    chatId=rid(); turns.innerHTML=''; syncEmpty(); refreshChats(); closeOverlay();
  } else if(def.action==='reveal'){
    await navigator.clipboard.writeText('~/Library/Application Support/PraisonAI');
    toast('Path copied: ~/Library/Application Support/PraisonAI');
  } else if(def.action==='update'){
    const u=await (await fetch('http://127.0.0.1:'+PORT+'/update')).json();
    toast(u.message || ('PraisonAI Desktop '+u.current));
  } else if(def.action==='mcp'){
    const {servers}=await (await fetch('http://127.0.0.1:'+PORT+'/mcp')).json();
    panel.innerHTML='<h2>MCP servers</h2><div id="mcplist"></div>'
      +'<div class="fld"><label>Name</label><input id="m-name" placeholder="filesystem"/></div>'
      +'<div class="fld"><label>Command</label><input id="m-cmd" placeholder="npx -y @modelcontextprotocol/server-filesystem /tmp"/></div>'
      +'<div class="row"><button class="ghost" id="m-close">Close</button><button id="m-add">Add server</button></div>';
    const list=panel.querySelector('#mcplist');
    if(!servers.length) list.innerHTML='<div class="hint">No servers configured.</div>';
    servers.forEach(sv=>{
      const d=document.createElement('div'); d.className='srow';
      d.innerHTML='<div class="srow-top"><div class="srow-lbl"><b></b><span></span></div>'
        +'<div class="srow-ctl"><div class="sw'+(sv.enabled?' on':'')+'"><i></i></div>'
        +'<button class="rst" title="Remove">✕</button></div></div>';
      d.querySelector('b').textContent=sv.name;
      d.querySelector('span').textContent=sv.command||'(no command)';
      d.querySelector('.sw').onclick=async()=>{
        await fetch('http://127.0.0.1:'+PORT+'/mcp',{method:'POST',
          headers:{'content-type':'application/json'},
          body:JSON.stringify({action:'toggle',name:sv.name})});
        runAction(def);
      };
      d.querySelector('.rst').onclick=async()=>{
        if(!await askConfirm('Remove '+sv.name+'?',{ok:'Remove'})) return;
        await fetch('http://127.0.0.1:'+PORT+'/mcp',{method:'POST',
          headers:{'content-type':'application/json'},
          body:JSON.stringify({action:'remove',name:sv.name})});
        runAction(def);
      };
      list.appendChild(d);
    });
    panel.querySelector('#m-close').onclick=closeOverlay;
    panel.querySelector('#m-add').onclick=async()=>{
      const name=panel.querySelector('#m-name').value.trim();
      const cmd=panel.querySelector('#m-cmd').value.trim();
      if(!name){ alert('A name is required.'); return; }
      const r=await (await fetch('http://127.0.0.1:'+PORT+'/mcp',{method:'POST',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({action:'add',name,command:cmd,enabled:false})})).json();
      if(!r.ok){ alert(r.error); return; }
      runAction(def);
    };
    overlay.classList.add('open');
  } else if(def.action==='logs'){
    closeOverlay(); document.getElementById('logsBtn').click();
  }
}

function settingRow(def){
  const row=document.createElement('div');
  row.className='srow'; row.id='setting-'+def.key;
  row.dataset.settingsLabel=def.label;
  const top=document.createElement('div'); top.className='srow-top';
  const lbl=document.createElement('div'); lbl.className='srow-lbl';
  lbl.innerHTML='<b></b>'+(def.description?'<span></span>':'');
  lbl.querySelector('b').textContent=def.label;
  if(def.description) lbl.querySelector('span').textContent=def.description;
  top.appendChild(lbl);

  const err=document.createElement('div'); err.className='warn'; err.style.display='none';
  const apply=async nv=>{
    const msg=def.validate?def.validate(nv,cfgGet):null;
    if(msg){ err.textContent=msg; err.style.display=''; return; }
    err.style.display='none';
    if(def.confirm && def.confirm.when(cfgGet(def.key),nv)
       && !await askConfirm(def.confirm.message,{ok:'Continue'})) { renderSettings(); return; }
    await saveCfg({[def.key]:nv});
    if(def.key==='theme') applyTheme(nv);
    if(def.key==='model') modelName.textContent=nv;
    renderSettings();
  };

  const multiline = def.control.kind==='text' && def.control.multiline;
  if(!multiline) top.appendChild(control(def,apply));

  // Per-field reset, free because the registry stores the default.
  if(def.default!==undefined && JSON.stringify(cfgGet(def.key))!==JSON.stringify(def.default)){
    const r=document.createElement('button');
    r.className='rst'; r.type='button'; r.title='Reset to default'; r.textContent='↺';
    r.onclick=()=>apply(def.default);
    (multiline?top:top.querySelector('.srow-ctl')).appendChild(r);
  }
  row.appendChild(top);

  if(multiline){
    const w=document.createElement('div'); w.className='srow-wide';
    const ta=document.createElement('textarea');
    ta.value=cfgGet(def.key)??''; if(def.control.placeholder)ta.placeholder=def.control.placeholder;
    ta.onchange=()=>apply(ta.value);
    w.appendChild(ta); row.appendChild(w);
  }
  row.appendChild(err);
  if(def.requiresRestart){
    const n=document.createElement('div'); n.className='restart';
    n.textContent='Takes effect after the engine restarts.';
    row.appendChild(n);
  }
  return row;
}

/** Open the overlay with an explanation instead of doing nothing. */
function engineDownPanel(what){
  panel.innerHTML='<h2></h2><p class="hint"></p>'
    +'<div class="row"><button class="ghost" id="ed-close">Close</button></div>';
  panel.querySelector('h2').textContent=what+' needs the engine';
  panel.querySelector('.hint').textContent=
    'The engine is not running, so there is nothing to read yet. '
    +'The status in the title bar says why it failed to start.';
  panel.querySelector('#ed-close').onclick=closeOverlay;
  overlay.classList.add('open');
}

/** True when the engine is reachable; otherwise explains and returns false. */
function requireEngine(what){
  if(PORT!==null && PORT!==undefined) return true;
  engineDownPanel(what);
  return false;
}

let activeSection='model', settingsQuery='';
function renderSettings(){
  const matches = settingsQuery ? searchSettings(settingsQuery,cfgGet) : null;
  panel.innerHTML='<h2>Settings</h2>'
    +'<input class="setsearch" id="setq" placeholder="Search settings…" autocomplete="off"/>'
    +'<div class="setnav"><div class="setside" id="setside"></div><div class="setbody" id="setbody"></div></div>';
  const q=panel.querySelector('#setq'); q.value=settingsQuery;
  q.oninput=()=>{ settingsQuery=q.value; renderSettings();
                  panel.querySelector('#setq').focus(); };
  const side=panel.querySelector('#setside'), body=panel.querySelector('#setbody');

  if(matches){
    side.style.display='none';
    if(!matches.length){ body.innerHTML='<div class="hint">No settings matched.</div>'; return; }
    matches.forEach(d=>body.appendChild(settingRow(d)));
    return;
  }
  SECTIONS.forEach(sec=>{
    const b=document.createElement('button'); b.type='button';
    b.className=sec.id===activeSection?'on':'';
    b.innerHTML='<span>'+sec.icon+'</span>'+sec.label;
    b.onclick=()=>{ activeSection=sec.id; renderSettings(); };
    side.appendChild(b);
  });
  const rows=SETTINGS.filter(d=>d.section===activeSection
    && (!d.visibleWhen || d.visibleWhen(cfgGet)));
  if(!rows.length){
    body.innerHTML='<div class="hint">Nothing to configure here yet.</div>';
  } else rows.forEach(d=>body.appendChild(settingRow(d)));
}

    cfg = await (await fetch('http://127.0.0.1:'+PORT+'/settings')).json();

async function checkUpdates(){
  try{
    const r=await fetch(`http://127.0.0.1:${PORT}/update`);
    if(!r.ok) return;
    const u=await r.json();
    if(!u.update_available) return;
    const b=document.createElement('div'); b.className='updbar';
    if(document.getElementById('updbar')) return;
    b.id='updbar';
    b.innerHTML='<span></span><button type="button" class="ghost updx">Dismiss</button>';
    b.querySelector('span').textContent=
      `praisonaiagents ${u.latest} is available (you have ${u.current}).`;
    b.querySelector('button').onclick=()=>b.remove();
    // Before the form, inside the same column, so it can never cover the
    // control the user is trying to type into.

  }catch{}

function applyTheme(t){
  document.documentElement.removeAttribute('data-theme');
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t);
}

document.getElementById('search').addEventListener('click',()=>{
  if(!requireEngine('Search')) return;
  panel.innerHTML=`<h2>Search conversations</h2>
    <div class="fld"><input id="q" placeholder="Type to search…" autocomplete="off"/></div>
    <div id="results"></div>`;
  const q=panel.querySelector('#q'), out=panel.querySelector('#results');
  let t=null;
  q.addEventListener('input',()=>{
    clearTimeout(t);
    t=setTimeout(async()=>{
      const term=q.value.trim();
      if(!term){ out.innerHTML=''; return; }
      let hits;
      try{
        ({hits}=await (await fetch(
          `http://127.0.0.1:${PORT}/search?q=${encodeURIComponent(term)}`)).json());
      }catch(e){
        out.innerHTML='<div class="hint"></div>';
        out.querySelector('.hint').textContent='Could not reach the engine to search.';
        return;
      }
      out.innerHTML = hits.length
        ? hits.map(()=>'<div class="res"><b></b><span></span></div>').join('')
        : '<div class="hint">No conversations matched.</div>';
      [...out.querySelectorAll('.res')].forEach((el,i)=>{
        el.querySelector('b').textContent=hits[i].title;
        el.querySelector('span').textContent=hits[i].snippet;
        el.onclick=()=>{ openChat(hits[i].id); closeOverlay(); };
      });
    },160);
  });
  overlay.classList.add('open'); q.focus();
});

// A webview has no browser chrome, so target="_blank" opens nothing at all.
// Route external links to the OS instead of letting the click die silently.
document.addEventListener('click',async e=>{
  const a=e.target.closest('a[href]');
  if(!a) return;
  const href=a.getAttribute('href')||'';
  if(!/^https?:/i.test(href)) return;   // never hand javascript:/data: to the shell
  e.preventDefault();
  try{
    const opener=window.__TAURI__?.opener?.openUrl
      || window.__TAURI__?.shell?.open;
    if(opener) await opener(href);
    else window.open(href,'_blank');
  }catch(err){
    fail('Could not open the link', href, '');
  }
});

document.addEventListener('click',e=>{
  if(!e.target.classList.contains('copy')) return;
  const code=e.target.parentElement.querySelector('code');
  navigator.clipboard.writeText(code.textContent);   // the source text, never the rendered DOM
  e.target.textContent='copied'; setTimeout(()=>e.target.textContent='copy',1200);
});

box.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); document.getElementById('f').requestSubmit(); }
});
