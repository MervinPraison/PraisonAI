<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PraisonAI</title>
<style>
:root{--ground:#0F1114;--panel:#171A1F;--ink:#E8EAED;--soft:#9AA1AC;--rule:#262B33;
      --accent:#7FD1B9;--bad:#E58B86;--user:#1E2430;--code:#0B0D10}
html{font-size:calc(16px * var(--ui-scale,1))}
:root{--fs:15px;--fs-code:12px;--ui-scale:1;--tok-k:#C792EA;--tok-s:#C3E88D;--tok-n:#F78C6C;--tok-f:#82AAFF;--rule-strong:#454F5D;
  /* The reading column. The transcript and the composer both derive from
     these two, so they cannot end up on different centre lines. */
  --col:46rem;--gutter:1.5rem}
.no-motion *{animation:none!important;transition:none!important}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:3.5rem;z-index:70;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:.5rem;padding:.5rem .875rem;font-size:.78rem;opacity:0;pointer-events:none;transition:opacity .18s ease;box-shadow:0 6px 20px rgba(0,0,0,.22)}
#toast.show{opacity:1}
.confirm-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;
  display:flex;align-items:center;justify-content:center;padding:1.5rem}
.confirm-box{background:var(--panel);border:1px solid var(--rule-strong);border-radius:12px;
  padding:1.1rem 1.2rem;width:min(24rem,100%);box-shadow:0 18px 48px rgba(0,0,0,.45)}
.confirm-box p{margin:0 0 1rem;font-size:.88rem;line-height:1.5}
.confirm-box .row{display:flex;gap:.5rem;justify-content:flex-end}
.confirm-box .ok.danger{background:var(--bad)}
.updbar .updx{font-size:.72rem;padding:.25rem .6rem}
/* In normal flow above the composer. Fixed-position at bottom:18px put it
   directly on top of the text field -- and a composer that grows to ten
   lines would have made it worse, not better. */
.updbar{width:100%;max-width:var(--col);margin:0 auto .55rem;display:flex;gap:.6rem;
  align-items:center;justify-content:space-between;background:var(--panel);color:var(--ink);
  border:1px solid var(--rule);border-radius:10px;padding:.5rem .55rem .5rem .8rem;
  font-size:.78rem}
.updbar span{color:var(--soft)}
:root[data-theme="light"]{--tok-k:#8250DF;--tok-s:#0A6E3E;--tok-n:#B34700;--tok-f:#0550AE;--rule-strong:#A8B1BC;--ground:#FBFBFC;--panel:#FFF;--ink:#14171C;--soft:#5B636E;
  --rule:#E2E5EA;--accent:#1F7A63;--bad:#A6413C;--user:#EEF2F7;--code:#F2F4F7}
:root[data-theme="dark"]{--tok-k:#C792EA;--tok-s:#C3E88D;--tok-n:#F78C6C;--tok-f:#82AAFF;--rule-strong:#454F5D;--ground:#0F1114;--panel:#171A1F;--ink:#E8EAED;--soft:#9AA1AC;
  --rule:#262B33;--accent:#7FD1B9;--bad:#E58B86;--user:#1E2430;--code:#0B0D10}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--tok-k:#8250DF;--tok-s:#0A6E3E;--tok-n:#B34700;--tok-f:#0550AE;--rule-strong:#A8B1BC;--ground:#FBFBFC;--panel:#FFF;--ink:#14171C;--soft:#5B636E;
      --rule:#E2E5EA;--accent:#1F7A63;--bad:#A6413C;--user:#EEF2F7;--code:#F2F4F7}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:.906rem/1.6 ui-sans-serif,-apple-system,system-ui,sans-serif;
     -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
#body{flex:1;display:flex;min-height:0}
#side{width:15.5rem;flex:none;border-right:1px solid var(--rule);background:var(--panel);
      display:flex;flex-direction:column;overflow:hidden}
.sidetop{padding:.6rem .55rem .35rem;display:flex;flex-direction:column;gap:.15rem}
.navbtn{display:flex;align-items:center;gap:.6rem;padding:.45rem .6rem;border-radius:7px;
  background:none;border:0;color:var(--ink);font:inherit;font-size:.86rem;cursor:pointer;text-align:left;width:100%}
.navbtn:hover{background:var(--ground)}
.navbtn .k{margin-left:auto;font-size:.68rem;color:var(--soft);font-family:ui-monospace,Menlo,monospace}
.navbtn .ic{width:.94rem;text-align:center;color:var(--soft)}
.sectlbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.11em;color:var(--soft);
  font-weight:700;padding:.9rem .75rem .35rem}
.sidefoot{border-top:1px solid var(--rule);padding:.45rem .55rem}
#side.hidden{display:none}
#chats{flex:1;overflow-y:auto;padding:.5rem}
.chat{padding:.4rem .6rem;border-radius:6px;cursor:pointer;font-size:.82rem;
      display:flex;justify-content:space-between;gap:.4rem;align-items:center;color:var(--soft)}
.chat .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:.08rem}
/* Without this, five conversations that opened with the same sentence are five
   identical rows and the list is unusable. */
.chat .meta{font-size:.66rem;color:var(--soft);opacity:.72;overflow:hidden;
            text-overflow:ellipsis;white-space:nowrap}
.chat.active .meta{opacity:.85}
.chat:hover{background:var(--ground)}
.chat.active{background:var(--ground);color:var(--ink);font-weight:600}
.chat .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .x{opacity:0;font-size:.9rem;line-height:1;padding:0 .15rem;transition:opacity .12s}
.chat:hover .x,.chat:focus-within .x,.chat:focus-visible .x{opacity:.75}
.chat .x:hover{opacity:1;color:var(--bad)}
.chat:hover .x{opacity:.55}
.chat .x:hover{opacity:1;color:var(--bad)}
.chat.corrupt .t{color:var(--bad);font-style:italic}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
.titlebar{height:2.75rem;-webkit-app-region:drag;flex:none;display:flex;align-items:center;
          gap:.6rem;padding:0 .9rem 0 5.2rem;border-bottom:1px solid var(--rule)}
.modelpill{-webkit-app-region:no-drag;display:flex;align-items:center;gap:.35rem;
  background:none;border:0;color:var(--ink);font:inherit;font-size:.85rem;font-weight:600;
  padding:.25rem .5rem;border-radius:7px;cursor:pointer}
.modelpill:hover{background:var(--panel)}
.modelpill .chev{color:var(--soft);font-size:.62rem}
#status{font-size:.62rem;padding:.1rem .4rem;border-radius:3px;margin-left:.6rem;letter-spacing:.06em}
.s-boot{color:var(--soft);background:color-mix(in srgb,var(--soft) 14%,transparent)}
.s-ready{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
.s-fail{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
#thread{flex:1;overflow-y:auto;padding:1.5rem 0;overflow-anchor:none;display:flex;flex-direction:column}
#thread.empty{justify-content:center}
#hero{display:none;text-align:center;padding:0 1.5rem 2rem}
#thread.empty #hero{display:block}
#hero h1{font-size:1.7rem;font-weight:600;margin:0 0 .4rem;letter-spacing:-.02em}
#hero p{color:var(--soft);margin:0;font-size:.9rem}
.mark{width:2.875rem;height:2.875rem;border-radius:.8rem;margin:0 auto .9rem;display:block}
.inner{width:100%;max-width:var(--col);margin:0 auto;padding:0 var(--gutter)}
/*
 * width:100% is load-bearing. #thread is a flex column, and an auto margin on
 * the cross axis of a flex item overrides `stretch` -- so `margin:0 auto`
 * alone made #turns shrink-wrap its content and centre *itself*, while the
 * composer (a block child of a block form) stayed full width. The two ended up
 * on different centre lines, ~240px apart. With an explicit width there is no
 * free space to absorb until max-width actually bites.
 */
.turn{margin-bottom:.9rem;content-visibility:auto;contain-intrinsic-size:auto 46rem auto 5.6rem}
/* The person's turn hugs its text and sits to the right; the answer runs the
   full column. Two shapes, so no label is needed to tell them apart. */
.turn.u{display:flex;flex-direction:column;align-items:flex-end}
.turn.u{margin-top:2rem}
.turn.u:first-child{margin-top:0}
.turn.live{content-visibility:visible}
/*
 * The label is kept for screen readers and removed from the page. A .65rem
 * uppercase "YOU" / "PRAISONAI" above every single turn is louder than the
 * message and carries information the layout already gives: a filled bubble on
 * the right is the person, full-width prose on the left is the answer. jan,
 * hermes and ollama all do it this way.
 */
.who{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
     clip-path:inset(50%);white-space:nowrap;border:0}
.bubble{word-break:break-word;overflow-wrap:break-word;font-size:var(--fs);line-height:1.62}
.bubble.plain{white-space:pre-wrap}
.bubble>*:first-child{margin-top:0}.bubble>*:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3{font-weight:650;line-height:1.3;margin:1.1em 0 .45em}
.bubble h1{font-size:1.3em}.bubble h2{font-size:1.15em}.bubble h3{font-size:1.03em}
.bubble p{margin:0 0 .75em}
.bubble ul,.bubble ol{margin:0 0 .75em;padding-left:1.4em}
.bubble li{margin:.2em 0}
.bubble code{background:var(--code);border:1px solid var(--rule);border-radius:4px;
  padding:.1em .34em;font-family:ui-monospace,Menlo,monospace;font-size:var(--fs-code)}
.bubble pre{background:var(--code);border:1px solid var(--rule);border-radius:8px;
  padding:.75rem .9rem;overflow-x:auto;margin:0 0 .8em;position:relative}
.bubble pre code{background:none;border:0;padding:0;font-size:var(--fs-code);line-height:1.5}
.bubble blockquote{margin:0 0 .8em;padding-left:.85em;border-left:3px solid var(--rule);color:var(--soft)}
.bubble a{color:var(--accent)}
.bubble hr{border:0;border-top:1px solid var(--rule);margin:1.1em 0}
.bubble table{border-collapse:collapse;display:block;width:max-content;max-width:100%;
  overflow-x:auto;margin:0 0 .8em;font-size:.9em}
.bubble th,.bubble td{border:1px solid var(--rule);padding:.35em .6em;text-align:left}
.bubble th{background:var(--code);font-weight:650}
.copy{position:absolute;top:.4rem;right:.4rem;font-size:.62rem;padding:.2rem .45rem;
  background:var(--panel);border:1px solid var(--rule);border-radius:4px;color:var(--soft);
  cursor:pointer;opacity:0;transition:opacity .12s}
.bubble pre:hover .copy{opacity:1}
.copy:hover{color:var(--ink)}
.turn.u .bubble{background:var(--user);padding:.6rem .9rem;border-radius:14px 14px 4px 14px;
  max-width:min(80%,34rem);width:fit-content}
.turn.u .acts{justify-content:flex-end}
.err{border-left:3px solid var(--bad);background:var(--panel);padding:.8rem 1rem;
     border-radius:0 8px 8px 0;font-size:.85rem}
.err b{color:var(--bad);display:block;margin-bottom:.3rem}
.errbtns{display:flex;gap:.4rem;margin-top:.6rem}
.setup{max-width:26rem;margin:2rem auto;text-align:center}
.setup h2{margin:.2rem 0 .5rem;font-size:1.25rem;font-weight:650;letter-spacing:-.01em}
.setup .lede{color:var(--soft);font-size:.85rem;line-height:1.55;margin:0 0 1.3rem}
.setup .steps{list-style:none;margin:0 0 1.3rem;padding:0;text-align:left;
  display:flex;flex-direction:column;gap:.5rem}
.setup .steps li{display:flex;align-items:center;gap:.6rem;font-size:.82rem;
  color:var(--soft);opacity:.55}
.setup .steps li.running,.setup .steps li.done,.setup .steps li.failed{opacity:1}
.setup .steps li.done{color:var(--ink)}
.setup .steps li.failed{color:var(--bad)}
.setup .dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--rule-strong);flex:none}
.setup li.running .dot{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
.setup li.done .dot{background:var(--accent)}
.setup li.failed .dot{background:var(--bad)}
.setup .dt{margin-left:auto;font-size:.68rem;opacity:.8;text-align:right;
  max-width:12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setup .row{display:flex;justify-content:center}
.setup .why{margin:1rem 0 0;font-size:.74rem;color:var(--soft);line-height:1.5}
.setup .why.bad{color:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.vnav{display:flex;align-items:center;gap:.1rem;margin-top:.35rem;color:var(--soft)}
.vnav .vb{background:none;border:0;color:var(--soft);cursor:pointer;font-size:.85rem;
  line-height:1;padding:.1rem .35rem;border-radius:5px}
.vnav .vb:hover:not(:disabled){background:var(--code);color:var(--ink)}
.vnav .vb:disabled{opacity:.3;cursor:default}
.vnav .vn{font-size:.68rem;font-variant-numeric:tabular-nums;min-width:2.2em;text-align:center}
:where(button,[role="button"],.chat,textarea,input,select,a):focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.fi:focus-within{border-color:var(--accent)!important;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
button:active:not(:disabled){filter:brightness(.93)}
#send:hover:not(:disabled){filter:brightness(1.09)}
.bubble pre:hover .copy,.copy:focus-visible{opacity:1}
.err pre{margin:.5rem 0 0;background:var(--code);border:1px solid var(--rule);border-radius:6px;
         padding:.55rem .7rem;font-size:.72rem;overflow-x:auto;white-space:pre-wrap}
.caret{display:inline-block;width:.44rem;height:1.05em;background:var(--accent);
       vertical-align:-2px;animation:b 1.1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
/* The gutter lives on .inner now, for the transcript and the composer alike.
   A top fade separates the last message from the field it scrolls under. */
form{flex:none;padding:.75rem 0 1.1rem;
  background:linear-gradient(to top,var(--ground) 68%,transparent)}
.fi{width:100%;border-color:var(--rule-strong)!important;background:var(--panel);border:1px solid var(--rule);
    border-radius:14px;padding:.7rem .8rem .55rem;transition:border-color .12s}
.fi:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,var(--rule))}
textarea{width:100%;resize:none;background:none;color:var(--ink);border:0;
         padding:.1rem .1rem .4rem;font:inherit;font-size:var(--fs);line-height:1.6;
         min-height:1.625rem;max-height:10rem;overflow-y:auto;outline:none}
textarea::placeholder{color:var(--soft)}
.ctools{display:flex;align-items:center;gap:.15rem}
.ctool{background:none;border:0;color:var(--soft);cursor:pointer;padding:.3rem .45rem;
  border-radius:6px;font-size:.8rem;display:flex;align-items:center;gap:.3rem}
.ctool:hover{background:var(--ground);color:var(--ink)}
.ctool.on{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.4rem}
.queued{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.45rem}
.qrow{display:flex;align-items:center;gap:.5rem;background:var(--ground);
  border:1px solid var(--rule);border-left:2px solid var(--accent);
  border-radius:6px;padding:.3rem .5rem;font-size:.78rem;color:var(--soft)}
.qrow .n{font-family:ui-monospace,Menlo,monospace;font-size:.68rem;flex:none;
  color:var(--accent);font-weight:700}
.qrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.qrow .x{cursor:pointer;flex:none;opacity:.5}
.qrow .x:hover{opacity:1;color:var(--bad)}
.chip{display:flex;align-items:center;gap:.35rem;background:var(--ground);border:1px solid var(--rule);
  border-radius:6px;padding:.2rem .45rem;font-size:.73rem;color:var(--soft)}
.chip b{color:var(--ink);font-weight:600}
.chip .x{cursor:pointer}.chip .x:hover{color:var(--bad)}
/* Was Material Palenight hardcoded with no light-theme override: strings
   measured 1.25:1 and keywords 2.18:1 against the light --code, i.e. syntax
   highlighting was effectively invisible in one of the two themes. */
.tok-k{color:var(--tok-k)}.tok-s{color:var(--tok-s)}
.tok-c{color:var(--soft);font-style:italic}
.tok-n{color:var(--tok-n)}.tok-f{color:var(--tok-f)}
.drop{outline:2px dashed var(--accent);outline-offset:-6px}
.grow{flex:1}
button{background:var(--accent);color:var(--ground);border:0;border-radius:8px;padding:0 1.1rem;
       font-weight:650;cursor:pointer;font-size:.85rem}
#send{width:1.875rem;height:1.875rem;padding:0;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font-size:.95rem;line-height:1}
button:disabled{opacity:.35;cursor:default}
#stop{width:auto;padding:0 .8rem;height:1.875rem;border-radius:1rem;font-size:.78rem}
button.stop{background:var(--bad)}
.ghost{background:none;border:1px solid var(--rule);color:var(--soft);padding:.25rem .6rem;
  font-size:.68rem;font-weight:650;border-radius:6px;cursor:pointer;-webkit-app-region:no-drag}
.ghost:hover{color:var(--ink);border-color:var(--soft)}
.tb-right{position:absolute;right:.9rem;display:flex;gap:.4rem}
.titlebar{position:relative}
.stats{font-size:.66rem;color:var(--soft);margin-top:.45rem;font-variant-numeric:tabular-nums}
.approval{border-left:3px solid var(--accent);background:var(--panel);
  padding:.7rem .9rem;border-radius:0 8px 8px 0;margin:.5rem 0;font-size:.83rem}
.approval b{display:block;margin-bottom:.15rem}
.approval code{font-size:.78rem}
.approval .btns{display:flex;gap:.5rem;margin-top:.6rem}
.approval button{font-size:.76rem;padding:.3rem .7rem;border-radius:6px}
.approval .deny{background:none;border:1px solid var(--rule);color:var(--soft)}
.approval .deny:hover{color:var(--bad);border-color:var(--bad)}
.approval .always{background:none;border:1px solid var(--rule);color:var(--soft)}
.cancelled{font-size:.7rem;color:var(--bad);margin-top:.4rem;font-weight:650}
.drafting{font-size:.75rem;color:var(--soft);margin:.4rem 0;font-style:italic}
.acts{display:flex;gap:.15rem;margin-top:.35rem;opacity:0;transition:opacity .12s}
.turn:hover .acts,.turn:focus-within .acts{opacity:1}
.act{font-size:.68rem;color:var(--soft);cursor:pointer;background:none;border:0;
  padding:.2rem .4rem;border-radius:5px;transition:background .12s,color .12s}
.act:hover{background:var(--code);color:var(--ink)}
.act:focus-visible{outline:2px solid var(--accent);outline-offset:1px;opacity:1}
.act:hover{color:var(--ink)}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:80;
         align-items:flex-start;justify-content:center;padding-top:8vh}
#overlay.open{display:flex}
.panel{background:var(--panel);border:1px solid var(--rule-strong);border-radius:12px;width:min(35rem,92vw);
       max-height:76vh;overflow-y:auto;padding:1.4rem 1.6rem;box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
.panel h2{margin:0 0 1.1rem;font-size:1.05rem;font-family:ui-monospace,Menlo,monospace}
.fld{margin-bottom:1.1rem}
.fld label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;
           color:var(--soft);font-weight:700;margin-bottom:.3rem}
.fld input,.fld select,.fld textarea{width:100%;background:var(--ground);color:var(--ink);
  border:1px solid var(--rule);border-radius:7px;padding:.5rem .65rem;font:inherit;font-size:.87rem}
.fld textarea{min-height:5rem;resize:vertical}
.hint{font-size:.72rem;color:var(--soft);margin-top:.25rem}
.row{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.2rem}
.res{padding:.5rem .6rem;border-radius:6px;cursor:pointer;font-size:.82rem}
.res:hover{background:var(--ground)}
.res b{display:block}
.setnav{display:flex;gap:1.4rem;align-items:flex-start}
.setside{width:9.4rem;flex:none;display:flex;flex-direction:column;gap:.1rem}
.setside button{background:none;border:0;color:var(--soft);font:inherit;font-size:.83rem;
  text-align:left;padding:.4rem .55rem;border-radius:6px;cursor:pointer;display:flex;gap:.5rem}
.setside button:hover{background:var(--ground);color:var(--ink)}
.setside button.on{background:var(--ground);color:var(--ink);font-weight:600}
.setbody{flex:1;min-width:0}
.srow{padding:.75rem 0;border-bottom:1px solid var(--rule)}
.srow:last-child{border-bottom:0}
.srow-top{display:flex;gap:1rem;align-items:flex-start}
.srow-lbl{flex:1;min-width:0}
.srow-lbl b{display:block;font-weight:600;font-size:.88rem}
.srow-lbl span{display:block;color:var(--soft);font-size:.76rem;margin-top:.1rem}
.srow-ctl{flex:none;min-width:9.4rem;display:flex;justify-content:flex-end;align-items:center;gap:.4rem}
.srow-ctl input[type=text],.srow-ctl input[type=password],.srow-ctl input[type=number],
.srow-ctl select{width:9.4rem;background:var(--ground);color:var(--ink);border:1px solid var(--rule);
  border-radius:6px;padding:.35rem .5rem;font:inherit;font-size:.83rem}
.srow-ctl textarea{width:100%;min-height:4.5rem}
.srow-wide{margin-top:.5rem}
.srow-wide textarea{width:100%;background:var(--ground);color:var(--ink);border:1px solid var(--rule);
  border-radius:6px;padding:.5rem .6rem;font:inherit;font-size:.83rem;resize:vertical}
.sw{width:2.125rem;height:1.19rem;border-radius:.6rem;background:var(--rule);position:relative;cursor:pointer;flex:none}
.sw.on{background:var(--accent)}
.sw i{position:absolute;top:.125rem;left:.125rem;width:.94rem;height:.94rem;border-radius:50%;
  background:var(--panel);transition:transform .13s}
.sw.on i{transform:translateX(15px)}
.seg{display:flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden}
.seg button{background:none;border:0;color:var(--soft);font:inherit;font-size:.76rem;
  padding:.28rem .55rem;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--ground);font-weight:650}

<script>
/* --- settings registry, inlined at build time --- */
/**
 * Settings as data.
 *
 * Every setting is one object. Row rendering, persistence, defaults, per-field
 * reset, validation, conditional visibility, restart notices and search all
 * derive from this list, so adding a setting is one entry and nothing else.
 *
 * The alternative -- hand-written form sections -- drifts the moment one
 * section is carved out: a reference app has an 847-line Appearance page
 * outside its own registry, and 7 of its ~15 rows are unreachable by search
 * because they were never given anchors.
 *
 * Four things the references could not express, added here deliberately:
 *   default          so per-field reset is free (none of the three has it)
 *   validate         so a threshold cannot be set negative
 *   requiresRestart  so a row can say so instead of a comment saying it
 *   confirm          so a destructive transition is gated
 */

const SECTIONS = [
  { id: "general",    label: "General",    icon: "⚙" },
  { id: "model",      label: "Models",     icon: "◈" },
  { id: "chat",       label: "Chat",       icon: "◇" },
  { id: "appearance", label: "Appearance", icon: "◐" },
  { id: "safety",     label: "Safety",     icon: "⚿" },
  { id: "data",       label: "Data",       icon: "▤" },
  { id: "integrations", label: "Integrations", icon: "⧉" },
  { id: "about",      label: "About",      icon: "ⓘ" },
];

const clampNum = (min, max) => (v) =>
  v === "" || v === null ? null
  : Number.isNaN(Number(v)) ? "Must be a number"
  : Number(v) < min ? `Must be at least ${min}`
  : Number(v) > max ? `Must be at most ${max}` : null;

const SETTINGS = [
  // ---- Models -------------------------------------------------------------
  { key: "model", section: "model", label: "Default model",
    description: "Any OpenAI-compatible model id. New chats use this.",
    keywords: ["llm", "gpt", "claude", "provider"],
    control: { kind: "combobox", suggestions: [
      "gpt-4o-mini", "gpt-4o", "gpt-4.1-mini", "o4-mini",
      "claude-sonnet-4-20250514", "claude-opus-4-20250514",
      "gemini-2.0-flash", "ollama/llama3.2",
    ]},
    default: "gpt-4o-mini" },

  { key: "temperature", section: "model", label: "Temperature",
    description: "Higher is more varied. 0 is nearly deterministic.",
    control: { kind: "slider", min: 0, max: 2, step: 0.05 },
    default: 0.7, validate: clampNum(0, 2) },

  { key: "max_tokens", section: "model", label: "Max output tokens",
    description: "0 lets the model decide.",
    control: { kind: "number", min: 0, max: 128000, step: 256 },
    default: 0, validate: clampNum(0, 128000) },

  { key: "top_p", section: "model", label: "Top-p",
    control: { kind: "slider", min: 0, max: 1, step: 0.01 },
    default: 1, validate: clampNum(0, 1) },

  { key: "base_url", section: "model", label: "Base URL override",
    description: "Point at a proxy, Azure, or a local server. Blank uses the provider default.",
    keywords: ["endpoint", "proxy", "azure", "ollama", "lm studio"],
    control: { kind: "text", placeholder: "https://api.openai.com/v1" },
    default: "", requiresRestart: true },

  { key: "api_key", section: "model", label: "API key",
    description: "Stored in the macOS keychain, never in the settings file. Blank uses the environment.",
    keywords: ["token", "secret", "credential", "openai"],
    control: { kind: "text", secret: true },
    // The engine refuses to export anything shorter than 20 characters, so
    // without this the field accepted a typo, stored it, echoed it back masked
    // as if it were set, and every turn failed as though no key existed.
    validate: (v) => (!v || String(v).length >= 20
      ? null
      : "That looks too short for an API key. Leave it blank to use the environment."),
    default: "", requiresRestart: true },

  // ---- Chat ---------------------------------------------------------------
  { key: "system_prompt", section: "chat", label: "System prompt",
    description: "Prepended to every conversation. Blank uses the default.",
    keywords: ["personality", "instructions", "persona"],
    control: { kind: "text", multiline: true, placeholder: "You are a careful assistant…" },
    default: "" },

  { key: "auto_title", section: "chat", label: "Name chats automatically",
    description: "Uses the first message as the title.",
    control: { kind: "toggle" }, default: true },

  { key: "show_reasoning", section: "chat", label: "Show reasoning",
    description: "Display the model's thinking when it emits any.",
    control: { kind: "toggle" }, default: true },

  { key: "collapse_reasoning", section: "chat", label: "Collapse reasoning by default",
    control: { kind: "toggle" }, default: false,
    visibleWhen: (g) => g("show_reasoning") === true },

  { key: "show_stats", section: "chat", label: "Show token stats",
    description: "Characters, duration and time to first token under each reply.",
    control: { kind: "toggle" }, default: true },

  { key: "condense_paste", section: "chat", label: "Condense long pastes",
    description: "Text longer than this becomes an attachment instead of filling the context.",
    keywords: ["clipboard", "context"],
    control: { kind: "select", options: [
      { value: 0, label: "Off" }, { value: 2000, label: "2,000 characters" },
      { value: 4000, label: "4,000 characters" }, { value: 8000, label: "8,000 characters" },
    ]}, default: 4000 },

  // ---- Appearance ---------------------------------------------------------
  { key: "theme", section: "appearance", label: "Theme",
    control: { kind: "segmented", options: [
      { value: "system", label: "System" }, { value: "light", label: "Light" },
      { value: "dark", label: "Dark" }]},
    default: "system" },

  { key: "font_size", section: "appearance", label: "Text size",
    description: "Scales the whole interface \u2014 messages, sidebar, settings and composer.",
    keywords: ["scale", "zoom", "bigger", "smaller", "interface"],
    control: { kind: "select", options: [
      { value: 13, label: "13 px" }, { value: 14, label: "14 px" },
      { value: 15, label: "15 px" }, { value: 16, label: "16 px" },
      { value: 18, label: "18 px" }, { value: 20, label: "20 px" }]},
    default: 15 },

  { key: "code_font_size", section: "appearance", label: "Code text size",
    control: { kind: "number", min: 10, max: 20, step: 1 },
    default: 12, validate: clampNum(10, 20) },

  { key: "reduce_motion", section: "appearance", label: "Reduce motion",
    control: { kind: "segmented", options: [
      { value: "system", label: "System" }, { value: "on", label: "On" },
      { value: "off", label: "Off" }]},
    default: "system" },

  // ---- Safety -------------------------------------------------------------
  { key: "approval_mode", section: "safety", label: "Tool approval",
    description: "How tool calls that touch your files are approved before running.",
    keywords: ["permissions", "confirm", "yolo", "sandbox"],
    control: { kind: "select", options: [
      { value: "ask",   label: "Ask every time" },
      { value: "smart", label: "Ask for risky actions" },
      { value: "never", label: "Never ask" }]},
    default: "ask",
    confirm: { when: (_p, n) => n === "never",
               message: "Tools will read your files without asking. Continue?" } },

  { key: "approval_timeout", section: "safety", label: "Approval timeout",
    description: "Seconds to wait before declining an unanswered request.",
    control: { kind: "number", min: 10, max: 3600, step: 10, unit: "s" },
    default: 300, validate: clampNum(10, 3600),
    visibleWhen: (g) => g("approval_mode") !== "never" },

  { key: "confirm_delete", section: "safety", label: "Confirm before deleting a chat",
    control: { kind: "toggle" }, default: true },

  // ---- General ------------------------------------------------------------
  { key: "launch_at_login", section: "general", label: "Open at login",
    control: { kind: "toggle" }, default: false, requiresRestart: true },

  { key: "check_updates", section: "general", label: "Check for updates automatically",
    control: { kind: "toggle" }, default: true },

  // ---- Data ---------------------------------------------------------------
  // Actions, not values. They carry no `default` and are skipped by save,
  // reset and search-by-value, but still get a row and an anchor for free.
  { key: "export_chats", section: "data", label: "Export all conversations",
    description: "Downloads every transcript as JSON.",
    keywords: ["backup", "download", "json"],
    control: { kind: "action", verb: "Export" }, action: "export" },

  { key: "open_data_dir", section: "data", label: "Data folder",
    description: "Transcripts and settings live outside the app bundle, so an update cannot take them with it.",
    keywords: ["storage", "location", "finder", "backup"],
    control: { kind: "action", verb: "Show path" }, action: "reveal" },

  { key: "clear_chats", section: "data", label: "Delete all conversations",
    description: "Cannot be undone.",
    keywords: ["reset", "wipe", "clear"],
    control: { kind: "action", verb: "Delete all", danger: true }, action: "clear",
    confirm: { when: () => true,
               message: "Delete every conversation? This cannot be undone." } },

  // ---- About --------------------------------------------------------------
  { key: "version", section: "about", label: "PraisonAI Desktop",
    control: { kind: "readout", value: () => "0.1.0" } },

  { key: "engine_status", section: "about", label: "Engine",
    description: "The Python process this window is talking to.",
    control: { kind: "readout", value: (ctx) => ctx.engine || "not connected" } },

  { key: "logs_link", section: "about", label: "Engine log",
    control: { kind: "action", verb: "Open" }, action: "logs" },

  { key: "check_now", section: "about", label: "Check for updates",
    control: { kind: "action", verb: "Check" }, action: "update" },

  // ---- Integrations -------------------------------------------------------
  { key: "mcp_servers", section: "integrations", label: "MCP servers",
    description: "Tool servers launched over stdio. Each is disabled until you enable it.",
    keywords: ["tools", "model context protocol", "stdio", "extensions"],
    control: { kind: "action", verb: "Manage" }, action: "mcp" },
];

// A duplicate key would silently shadow, so fail at load instead.
const seen = new Set();
for (const s of SETTINGS) {
  if (seen.has(s.key)) throw new Error(`duplicate setting key: ${s.key}`);
  seen.add(s.key);
}

const DEFAULTS = Object.fromEntries(SETTINGS.map((s) => [s.key, s.default]));

/** Search entries derive from the registry, never a parallel list, and respect
 *  visibleWhen -- so search can never return a row that cannot be shown. */
function searchSettings(query, get) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const terms = q.split(/\s+/);
  const scored = [];
  for (const s of SETTINGS) {
    if (s.visibleWhen && !s.visibleWhen(get)) continue;
    const hay = [s.label, s.description || "", ...(s.keywords || []), s.key]
      .join(" ").toLowerCase();
    if (!terms.every((t) => hay.includes(t))) continue;
    const l = s.label.toLowerCase();
    scored.push({ s, score: l === q ? 100 : l.startsWith(q) ? 90
      : l.includes(q) ? 80 : (s.keywords || []).some((k) => k.includes(q)) ? 70 : 50 });
  }
  return scored.sort((a, b) => b.score - a.score).map((x) => x.s);
}

window.__REGISTRY__ = { SECTIONS, SETTINGS, DEFAULTS, searchSettings };

const { invoke } = window.__TAURI__.core;
const turns=document.getElementById('turns'), thread=document.getElementById('thread');
const status=document.getElementById('status'), box=document.getElementById('p'), send=document.getElementById('send');
let PORT=null, atBottom=true, activeRun=null, activeReader=null;
/** Set by Regenerate for exactly one submit, then cleared. */
let regenerateOf=null;
// The renderer honours these directly -- everything in here was previously
// written to settings.json and read by nothing.
let CFG={...DEFAULTS};
/** The text size the stylesheet was authored against; --ui-scale is relative
 *  to this, so 15 leaves the interface exactly as designed. */
const BASE_TEXT_PX=15;
/**
 * In-app confirmation, because `window.confirm` does not work here.
 *
 * A WKWebView under Tauri implements no JS dialog panel, so `confirm()` returns
 * false immediately without ever showing anything. Every guard written as
 * `if (!confirm(...)) return;` therefore took the cancel branch every time --
 * which is how adding `confirm_delete` silently broke deleting a conversation
 * outright. Returns a promise so callers read the same way they did.
 */
function askConfirm(message, {danger=true, ok='Delete', cancel='Cancel'}={}){
  return new Promise(resolve=>{
    const back=document.createElement('div'); back.className='confirm-back';
    back.innerHTML='<div class="confirm-box" role="alertdialog" aria-modal="true">'
      +'<p></p><div class="row"><button type="button" class="ghost cx"></button>'
      +'<button type="button" class="ok"></button></div></div>';
    back.querySelector('p').textContent=message;
    const okBtn=back.querySelector('.ok'), cxBtn=back.querySelector('.cx');
    okBtn.textContent=ok; cxBtn.textContent=cancel;
    if(danger) okBtn.classList.add('danger');
    const close=v=>{ back.remove(); document.removeEventListener('keydown',key); resolve(v); };
    const key=e=>{ if(e.key==='Escape'){ e.preventDefault(); close(false); } };
    okBtn.onclick=()=>close(true); cxBtn.onclick=()=>close(false);
    back.onclick=e=>{ if(e.target===back) close(false); };
    document.addEventListener('keydown',key);
    document.body.appendChild(back);
    okBtn.focus();
  });
}

let toastTimer=null;
/** Brief, non-blocking confirmation. Silence after an action the user did not
 *  explicitly ask for -- a paste turning into a chip -- reads as a bug. */
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2600);
}
function applyPrefs(c){
  const r=document.documentElement.style;
  const size=Number(c.font_size)||15;
  // Text size used to set --fs, which only .bubble read -- so the chat text
  // changed and the sidebar, titlebar, settings and composer did not. Driving
  // the rem root instead scales the whole interface, because everything else
  // in the stylesheet is expressed in rem. 15 is the default and corresponds
  // to the 16px root the sheet was designed against.
  const scale=size/BASE_TEXT_PX;
  r.setProperty('--ui-scale', String(scale));
  // Derived from the same scale rather than restated, and code scales with
  // prose instead of staying at its absolute setting while everything grows.
  r.setProperty('--fs', size+'px');
  r.setProperty('--fs-code', ((Number(c.code_font_size)||12)*scale).toFixed(2)+'px');
  const motion = c.reduce_motion === undefined ? 'system' : String(c.reduce_motion);
  const reduce = motion === 'on'
    || (motion === 'system'
        && window.matchMedia?.('(prefers-reduced-motion: reduce)').matches === true);
  document.documentElement.classList.toggle('no-motion', reduce);
}
const stopBtn=document.getElementById('stop'), newChat=document.getElementById('newchat');
const rid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const modelName=document.getElementById('modelname');
const hero=document.getElementById('hero');
// The hero is shown by a class on the thread, so the empty state cannot drift
// out of sync with whether the transcript actually has content.
const syncEmpty=()=>thread.classList.toggle('empty', turns.children.length===0);
let toolsOn=true;
// Messages typed while a turn is running. All three reference apps allow this;
// blocking the composer mid-run makes a user wait to record a thought they
// already had. Queued prompts send in order as each turn settles.
const queue=[]; let running=false;
const queuedEl=document.getElementById('queued');
function renderQueue(){
  queuedEl.innerHTML='';
  queue.forEach((q,i)=>{
    const r=document.createElement('div'); r.className='qrow';
    r.innerHTML='<span class="n"></span><span class="t"></span><span class="x" title="Remove">×</span>';
    r.querySelector('.n').textContent=(i+1)+' of '+queue.length;
    r.querySelector('.t').textContent=q;
    r.querySelector('.x').onclick=()=>{ queue.splice(i,1); renderQueue(); };
    queuedEl.appendChild(r);
  });
}
const chatsEl=document.getElementById('chats');
let chatId=rid();

async function refreshChats(){
  if(!PORT) return;
  try{
    const {chats}=await (await fetch(`http://127.0.0.1:${PORT}/chats`)).json();
    chatsEl.innerHTML='';
    const groups={};
    for(const c of chats){ (groups[c.project||'']??=[]).push(c); }
    const order=Object.keys(groups).sort((a,b)=>a===''?1:b===''?-1:a.localeCompare(b));
    for(const g of order){
      if(g){ const lbl=document.createElement('div'); lbl.className='sectlbl';
             lbl.style.padding='.7rem .75rem .2rem'; lbl.textContent=g;
             chatsEl.appendChild(lbl); }
      for(const c of groups[g]){
      const d=document.createElement('div');
      d.className='chat'+(c.id===chatId?' active':'')+(c.corrupt?' corrupt':'');
      d.innerHTML='<span class="ct"><span class="t"></span><span class="meta"></span></span>'
                 +'<span class="x" title="Delete">\u00d7</span>';
      d.querySelector('.t').textContent=c.title;
      d.querySelector('.meta').textContent=
        [relTime(c.updated), c.count ? c.count+' messages' : null]
          .filter(Boolean).join(' \u00b7 ');
      d.querySelector('.t').title=c.title;   // truncated titles are unreadable otherwise
      d.tabIndex=0;
      d.setAttribute('role','button');
      d.setAttribute('aria-label',c.title);
      if(c.id===chatId) d.setAttribute('aria-current','true');
      d.onclick=ev=>{ if(!ev.target.closest('.x')) openChat(c.id); };
      d.onkeydown=ev=>{
        if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); openChat(c.id); }
      };
      d.querySelector('.x').onclick=async ev=>{
        ev.stopPropagation();
        if(CFG.confirm_delete!==false && !await askConfirm(
             `Delete \u201c${c.title}\u201d? This cannot be undone.`)) return;
        await fetch(`http://127.0.0.1:${PORT}/chats/${c.id}`,{method:'DELETE'});
        if(c.id===chatId){ chatId=rid(); turns.innerHTML=''; syncEmpty(); }
        refreshChats();
      };
      d.oncontextmenu=async ev=>{
        ev.preventDefault();
        const name=prompt('Move to project (blank to remove):', c.project||'');
        if(name===null) return;
        await fetch('http://127.0.0.1:'+PORT+'/project/'+c.id,{method:'POST',
          headers:{'content-type':'application/json'},body:JSON.stringify({project:name})});
        refreshChats();
      };
      chatsEl.appendChild(d);
      }
    }
  }catch{}
}

async function openChat(id){
  chatId=id; turns.innerHTML=''; syncEmpty();
  try{
    const r=await fetch(`http://127.0.0.1:${PORT}/chats/${id}`);
    if(!r.ok){ fail('Conversation not found',
      'It may have been deleted in another window.',''); refreshChats(); return; }
    const c=await r.json();
    const msgs=c.messages||[];
    msgs.forEach((m,i)=>{
      const b=turn(m.role==='user'?'u':'a', m.role==='user'?'You':'PraisonAI');
      if(m.role==='user'){ b.classList.add('plain'); b.textContent=m.content; }
      else b.innerHTML=md(m.content);
      b.parentElement.classList.remove('live');
      // Stored position, not DOM position -- see addActions.
      b.parentElement.dataset.msgIndex=String(i);
      if(m.role!=='user'){
        addActions(b.parentElement, msgs[i-1]?.content||'', m.content, i-1,
                   m.version_count||1, m.version_active||0);
      }
    });
  }catch{}
  refreshChats(); atBottom=true; stick();
}

// Follow the tail only while the reader is already at the bottom. WebKit has no
// overflow-anchor, so this is explicit rather than delegated to the browser.
thread.addEventListener('scroll',()=>{
  atBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 80;
});
const stick=()=>{ if(atBottom) thread.scrollTop=thread.scrollHeight; };

// Compact markdown renderer. Deliberately small and dependency-free: a CDN is
// unavailable to a packaged app, and the alternative -- shipping a full parser --
// is a decision to make with measurements, not by default.
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// Small tokeniser rather than a highlighter library: a CDN is unreachable from a
// packaged app, and shipping a grammar engine is a decision to make with
// measurements. Strings and comments match first, so a keyword inside one is
// never recoloured.
const KW = /\b(const|let|var|function|return|if|else|for|while|class|import|from|export|async|await|new|try|catch|finally|throw|def|elif|lambda|pass|with|as|in|is|not|and|or|None|True|False|self|fn|mut|pub|impl|struct|enum|match|use|type|interface|public|private|static|void)\b/g;
const STR = /("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`|\/\/[^\n]*|#[^\n]*)/g;
function hl(code){
  const plain = t => esc(t)
    .replace(KW, '<span class="tok-k">$1</span>')
    .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="tok-n">$1</span>')
    .replace(/\b([A-Za-z_]\w*)\s*\(/g, '<span class="tok-f">$1</span>(');
  const out = []; let i = 0, m;
  STR.lastIndex = 0;
  while ((m = STR.exec(code))) {
    out.push(plain(code.slice(i, m.index)));
    const cls = /^(\/\/|#)/.test(m[0]) ? 'tok-c' : 'tok-s';
    out.push('<span class="' + cls + '">' + esc(m[0]) + '</span>');
    i = m.index + m[0].length;
  }
  out.push(plain(code.slice(i)));
  return out.join('');
}

function md(src){
  const blocks=[]; // pull fenced code out first so nothing inside it is transformed
  src=src.replace(/```([\w-]*)\n([\s\S]*?)```/g,(m,lang,code)=>{
    blocks.push(`<pre><button class="copy">copy</button><code data-lang="${esc(lang)}">${hl(code.replace(/\n$/,''))}</code></pre>`);
    return `\u0000${blocks.length-1}\u0000`;
  });
  const inline=t=>esc(t)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  const out=[]; let list=null;
  const closeList=()=>{ if(list){ out.push(`</${list}>`); list=null; } };
  for(const raw of src.split('\n')){
    const line=raw.replace(/\s+$/,'');
    if(/^\u0000\d+\u0000$/.test(line)){ closeList(); out.push(line); continue; }
    if(!line.trim()){ closeList(); continue; }
    let m;
    if((m=line.match(/^(#{1,3})\s+(.*)$/))){ closeList(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
    if(/^(---|\*\*\*|___)\s*$/.test(line)){ closeList(); out.push('<hr>'); continue; }
    if((m=line.match(/^>\s?(.*)$/))){ closeList(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); continue; }
    if((m=line.match(/^\s*[-*+]\s+(.*)$/))){ if(list!=='ul'){closeList();out.push('<ul>');list='ul';} out.push(`<li>${inline(m[1])}</li>`); continue; }
    if((m=line.match(/^\s*\d+[.)]\s+(.*)$/))){ if(list!=='ol'){closeList();out.push('<ol>');list='ol';} out.push(`<li>${inline(m[1])}</li>`); continue; }
    closeList(); out.push(`<p>${inline(line)}</p>`);
  }
  closeList();
  return out.join('').replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[+i]);
}

// One card per tool call, keyed by call_id so a result finds its own call even
// when several run in parallel. State lives on the element, not in a lookup that
// could drift from the DOM.
const MAX_OUTPUT=20000, MAX_LINES=2000;
function toolCard(host,callId,name,args){
  const el=document.createElement('div');
  el.className='tool running'; el.dataset.call=callId;
  el.innerHTML=`<div class="tool-head"><span class="tool-dot"></span>
      <span class="tool-name"></span><span class="tool-meta">running…</span>
      <span class="tool-chev">▶</span></div>
    <div class="tool-body"><div class="tool-label">Arguments</div><pre class="args"></pre>
      <div class="out-wrap" style="display:none">
        <div class="tool-label">Result</div><pre class="out"></pre></div></div>`;
  el.querySelector('.tool-name').textContent=name;
  el.querySelector('.args').textContent=
    typeof args==='string'?args:JSON.stringify(args??{},null,2);
  el.querySelector('.tool-head').onclick=()=>el.classList.toggle('open');
  host.appendChild(el); stick();
  return el;
}
function toolResult(host,callId,name,ok,output,seconds){
  let el=host.querySelector(`.tool[data-call="${CSS.escape(callId||'')}"]`);
  // A result with no matching call still gets a card: dropping it would hide a
  // tool that ran, which is worse than showing one we cannot pair up.
  if(!el) el=toolCard(host,callId,name,{});
  el.className=`tool ${ok?'ok':'err'}`+(el.classList.contains('open')?' open':'');
  el.querySelector('.tool-meta').textContent=
    (ok?'':'failed · ')+(seconds!=null?`${seconds}s`:'done');
  const w=el.querySelector('.out-wrap'), pre=el.querySelector('.out');
  w.style.display='';
  const full=String(output??'');
  // Keep the TAIL, not the head. For command output the end is the part that
  // matters -- the error, the summary, the last line -- and head-truncating
  // hides exactly what the user opened the card to read.
  const lines=full.split('\n');
  let visible=full, hiddenLines=0;
  if(lines.length>MAX_LINES){ hiddenLines=lines.length-MAX_LINES; visible=lines.slice(hiddenLines).join('\n'); }
  if(visible.length>MAX_OUTPUT){ visible=visible.slice(visible.length-MAX_OUTPUT); }
  pre.textContent=visible;
  if(visible!==full){
    const more=document.createElement('span'); more.className='more';
    more.textContent=hiddenLines
      ? `Show all — ${hiddenLines.toLocaleString()} earlier lines hidden`
      : `Show all ${full.length.toLocaleString()} characters`;
    more.onclick=()=>{pre.textContent=full;more.remove();};
    w.appendChild(more);
  }
  // Copy always yields the UNCAPPED text, never what is on screen.
  const cp=document.createElement('span'); cp.className='more'; cp.style.marginLeft='.7rem';
  cp.textContent='Copy output';
  cp.onclick=()=>{navigator.clipboard.writeText(full);
    cp.textContent='Copied'; setTimeout(()=>cp.textContent='Copy output',1200);};
  w.appendChild(cp);
  if(!ok) el.classList.add('open');   // failures open themselves; successes stay quiet
  stick();
}
// Copy / regenerate / delete, attached once a turn settles.
/**
 * `userIndex` is the position the user message actually occupies on disk, sent
 * by the engine on `end`. It used to be derived from DOM position -- but a
 * cancelled or errored turn stays on screen and is never persisted, so every
 * later Fork and Delete pointed one exchange too far. The 404 that came back
 * was ignored and the turn was removed from the screen regardless, so it looked
 * deleted and reappeared on reopen.
 *
 * A null index means the turn was never stored; Fork and Delete are then not
 * offered at all, rather than offered and silently wrong.
 */
/**
 * `< 2/3 >` over the stored answers to one prompt.
 *
 * Regenerating used to replace the previous answer, so comparing two of them
 * meant copying one out first. The engine now keeps them all and this selects
 * which is live.
 */
function versionNav(turnEl, userIndex, count, active){
  turnEl.querySelector('.vnav')?.remove();
  if(!(count>1)) return;
  const nav=document.createElement('div'); nav.className='vnav';
  nav.innerHTML='<button type="button" class="vb" aria-label="Previous version">\u2039</button>'
    +'<span class="vn"></span>'
    +'<button type="button" class="vb" aria-label="Next version">\u203a</button>';
  const [prev,next]=nav.querySelectorAll('.vb');
  const label=nav.querySelector('.vn');
  const paint=()=>{
    label.textContent=`${active+1}/${count}`;
    prev.disabled=active===0; next.disabled=active===count-1;
  };
  const go=async d=>{
    const want=active+d;
    if(want<0||want>=count) return;
    try{
      const r=await fetch(`http://127.0.0.1:${PORT}/version/${chatId}/${userIndex}/${want}`,
        {method:'POST'});
      const j=await r.json();
      if(!r.ok||!j.ok){ fail('Could not switch version', j.error||`HTTP ${r.status}`,''); return; }
      active=want;
      turnEl.querySelector('.bubble').innerHTML=md(j.content);
      paint(); stick();
    }catch(e){ fail('Could not switch version', String(e),''); }
  };
  prev.onclick=()=>go(-1); next.onclick=()=>go(1);
  paint();
  turnEl.appendChild(nav);
}

function addActions(turnEl, prompt, answer, userIndex, versions, active){
  versionNav(turnEl, userIndex, versions||1, active||0);
  if(turnEl.querySelector('.acts')) return;
  const bar=document.createElement('div'); bar.className='acts';
  const mk=(label,fn)=>{ const b=document.createElement('button');
    b.className='act'; b.type='button'; b.textContent=label; b.onclick=fn; bar.appendChild(b); };
  mk('Copy',()=>{ navigator.clipboard.writeText(answer); });   // the source text, not the DOM
  mk('Regenerate',()=>{
    // Named so the engine files the answer against the same prompt rather than
    // appending a second copy of the question.
    regenerateOf = Number.isInteger(userIndex) ? userIndex : null;
    setComposer(prompt);
    document.getElementById('f').requestSubmit();
  });
  if(Number.isInteger(userIndex)){
    mk('Fork',async()=>{
      try{
        const r=await fetch(`http://127.0.0.1:${PORT}/fork/${chatId}/${userIndex+1}`,
          {method:'POST'});
        const j=await r.json();
        if(r.ok && j.ok) openChat(j.id);
        else fail('Could not fork', j.error||`The engine returned ${r.status}.`,'');
      }catch(e){ fail('Could not fork', String(e),''); }
    });
    mk('Delete',async()=>{
      if(CFG.confirm_delete!==false && !await askConfirm(
           'Delete this exchange? This cannot be undone.')) return;
      try{
        const r=await fetch(`http://127.0.0.1:${PORT}/messages/${chatId}/${userIndex}`,
          {method:'POST'});
        if(!r.ok){
          // Removing it from the screen anyway is how a message looked deleted
          // and came back on reopen.
          fail('Could not delete', `The engine returned ${r.status}.`,''); return;
        }
      }catch(e){ fail('Could not delete', String(e),''); return; }
      turnEl.previousElementSibling?.remove(); turnEl.remove();
      openChat(chatId);   // re-read, so every remaining index is authoritative
    });
  }
  turnEl.appendChild(bar);
}

/** "just now" / "14m" / "3h" / "Tue" / "12 Mar" -- short enough for a sidebar. */
function relTime(epochSeconds){
  if(!epochSeconds) return '';
  const d=Math.max(0,Math.floor(Date.now()/1000-epochSeconds));
  if(d<60) return 'just now';
  if(d<3600) return Math.floor(d/60)+'m ago';
  if(d<86400) return Math.floor(d/3600)+'h ago';
  const then=new Date(epochSeconds*1000);
  if(d<604800) return then.toLocaleDateString(undefined,{weekday:'short'});
  return then.toLocaleDateString(undefined,{day:'numeric',month:'short'});
}

function thinkBlock(host){
  const el=document.createElement('div');
  el.className='think';
  el.innerHTML=`<div class="think-head"><span class="tool-chev">▶</span><span class="lbl">Thinking…</span></div>
                <div class="think-body"></div>`;
  if(CFG.collapse_reasoning!==true) el.classList.add('open');

  host.appendChild(el); stick();

function turn(cls,who){
  const d=document.createElement('div'); d.className=`turn ${cls} live`;
  d.innerHTML=`<div class="who">${who}</div><div class="bubble"></div>`;
  turns.appendChild(d); syncEmpty(); stick(); return d.querySelector('.bubble');
}
/**
 * `retry` is the prompt to re-send. When present the banner carries a button,
 * because an error the user can act on and an error they can only read are
 * different things -- ours only ever did the second.
 */
function fail(title,detail,tail,retry){
  const d=document.createElement('div'); d.className='turn';
  d.innerHTML='<div class="err"><b></b><span></span></div>';
  d.querySelector('b').textContent=title;
  d.querySelector('span').textContent=detail||'';
  if(tail){ const pre=document.createElement('pre'); pre.textContent=tail;
            d.querySelector('.err').appendChild(pre); }
  if(retry){
    const row=document.createElement('div'); row.className='errbtns';
    const again=document.createElement('button');
    again.type='button'; again.className='ghost'; again.textContent='Try again';
    again.onclick=()=>{ d.remove(); syncEmpty(); setComposer(retry);
                        document.getElementById('f').requestSubmit(); };
    const copy=document.createElement('button');
    copy.type='button'; copy.className='ghost'; copy.textContent='Copy details';
    copy.onclick=()=>{ navigator.clipboard.writeText(
      [title,detail,tail].filter(Boolean).join('\n\n'));
      copy.textContent='Copied'; setTimeout(()=>copy.textContent='Copy details',1200); };
    row.append(again,copy); d.querySelector('.err').appendChild(row);
  }
  turns.appendChild(d); syncEmpty(); stick();
  return d;
}

// Publish at most once per frame. Without this the render cost scales with token
// count instead of elapsed time, and the app degrades exactly when the model is fastest.
// Ported verbatim from frontend/src/stream-pacing.ts, which is the tested
// implementation. The earlier copy here omitted clearTimeout, so the fallback
// timer from one cycle fired during the next and reopened the gate early --
// pacing that quietly stopped pacing. shipped-gate.test.mjs runs the module's
// own assertions against *this* function so the two cannot drift again.
const MAX_HELD_CHARS=256, UNPAINTED_REOPEN_MS=500;
function gate(){
  let open=true, publishedAt=0, timer=null;
  return streamed=>{
    if(!open && streamed-publishedAt<MAX_HELD_CHARS) return false;
    publishedAt=streamed;
    if(open){
      open=false;
      const reopen=()=>{ open=true; if(timer!==null){ clearTimeout(timer); timer=null; } };
      requestAnimationFrame(reopen);
      timer=setTimeout(reopen,UNPAINTED_REOPEN_MS);
    }
    return true;
  };
}

async function boot(){
const st=await invoke('engine_status');
if(st.state==='ready'){
  PORT=st.port; status.textContent=`engine :${PORT}`; status.className='s-ready';
  box.disabled=send.disabled=false; box.focus(); refreshChats(); refreshModelName();
  try{ CFG={...DEFAULTS,...await (await fetch(
        `http://127.0.0.1:${PORT}/settings`)).json()}; }catch{}
  applyTheme(CFG.theme);
  applyPrefs(CFG);
  if(CFG.check_updates!==false) checkUpdates();
}else if(st.reason==='No usable Python'){
  // A clean machine has nothing to run the engine with. Offering to build it
  // is the difference between a product and an error message: "No usable
  // Python" is true and useless to someone who has never installed one.
  status.textContent='setup needed'; status.className='s-boot';
  firstRun(st);
}else{
  status.textContent='engine failed'; status.className='s-fail';
  fail(st.reason, st.detail, st.tail);
}
}

/** The steps the shell reports, in the order it runs them. */
const SETUP_STEPS=[
  {id:'uv',     label:'Fetching the installer'},
  {id:'python', label:'Installing Python'},
  {id:'venv',   label:'Creating the environment'},
  {id:'deps',   label:'Installing PraisonAI'},
];

/**
 * First run: build the engine's environment, showing what is happening.
 *
 * The whole thing takes minutes on a cold machine. A window that says nothing
 * for three minutes is indistinguishable from one that has hung, so every step
 * is listed up front and marked as it completes.
 */
function firstRun(st){
  thread.classList.remove('empty');
  turns.innerHTML='';
  const w=document.createElement('div'); w.className='setup';
  w.innerHTML='<img class="mark" src="logo.png" alt="" width="46" height="46"/>'
    +'<h2>One-time setup</h2>'
    +'<p class="lede"></p>'
    +'<ol class="steps"></ol>'
    +'<div class="row"><button type="button" class="go">Set up PraisonAI</button></div>'
    +'<p class="why"></p>';
  w.querySelector('.lede').textContent=
    'PraisonAI needs a Python environment to run its engine. This downloads it '
    +'into your Library folder \u2014 nothing is installed system-wide, and it '
    +'only happens once.';
  w.querySelector('.why').textContent=st.detail||'';
  const list=w.querySelector('.steps');
  const rows={};
  for(const s of SETUP_STEPS){
    const li=document.createElement('li');
    li.innerHTML='<span class="dot"></span><span class="lb"></span><span class="dt"></span>';
    li.querySelector('.lb').textContent=s.label;
    list.appendChild(li); rows[s.id]=li;
  }
  const go=w.querySelector('.go');
  turns.appendChild(w); syncEmpty();

  const mark=(id,state,detail)=>{
    const li=rows[id]; if(!li) return;
    li.className=state;
    li.querySelector('.dt').textContent=detail||'';
  };

  go.onclick=async()=>{
    go.disabled=true; go.textContent='Setting up\u2026';
    w.querySelector('.why').textContent='';
    let un=null;
    try{
      un=await window.__TAURI__.event.listen('provision',e=>{
        const {id,state,detail}=e.payload||{};
        mark(id,state,detail);
      });
      await invoke('provision_engine');
      // The engine is spawned by engine_status, so the shortest correct path
      // from here is to start over with an interpreter that now exists.
      go.textContent='Starting\u2026';
      await boot();
      if(PORT!==null) w.remove();
    }catch(err){
      go.disabled=false; go.textContent='Try again';
      const why=w.querySelector('.why');
      why.textContent=String(err&&err.message||err);
      why.className='why bad';
    }finally{ if(un) un(); }
  };
}
boot();

document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const text=box.value.trim(); if(!text||!PORT) return;
  setComposer('');
  if(running){ queue.push(text); renderQueue(); return; }
  running=true;
  send.style.display='none'; stopBtn.style.display=''; box.focus();
  const runId=rid(); activeRun=runId;
  const sent=attached; attached=[]; renderChips();
  const ub=turn('u','You'); ub.classList.add('plain'); ub.textContent=text;
  const out=turn('a','PraisonAI');
  out.innerHTML='<span class="caret"></span>';

  let acc='', streamed=0, userIndex=null, versions=1, vactive=0;
  const regen=regenerateOf; regenerateOf=null;   // consumed by this submit only
  const canPublish=gate();
  const host=out.parentElement;
  let think=null, thinkText='', thinkStart=0, thinkTimer=null, draft=null;
  const paint=()=>{ out.innerHTML=md(acc); stick(); };

  try{
    // SSE straight from the webview to the engine. Nothing streams through IPC.
    const res=await fetch(`http://127.0.0.1:${PORT}/chat`,{
      method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:text,chat_id:chatId,session:chatId,run_id:runId,
      attachments:sent,tools:toolsOn,regenerate_of:regen})});
    const reader=res.body.getReader(); activeReader=reader;
    const dec=new TextDecoder();
    let buf='';
    for(;;){
      const {done,value}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const frame=buf.slice(0,i); buf=buf.slice(i+2);
        const ev=(frame.match(/^event: (.+)$/m)||[])[1];
        const dl=(frame.match(/^data: (.+)$/m)||[])[1];
        if(!ev) continue;
        const data=dl?JSON.parse(dl):{};
        if(ev==='delta'){
          if(think){ clearInterval(thinkTimer);
            think.querySelector('.lbl').textContent=
              `Thought for ${((Date.now()-thinkStart)/1000).toFixed(1)}s`;
            think=null; }
          acc+=data.text; streamed+=data.text.length;
          if(canPublish(streamed)) paint(); }
        else if(ev==='reasoning'){
          if(!think){ think=thinkBlock(host); thinkStart=Date.now();
            thinkTimer=setInterval(()=>{ if(think) think.querySelector('.lbl').textContent=
              `Thinking… ${((Date.now()-thinkStart)/1000).toFixed(1)}s`; },100); }
          thinkText+=data.text; think.querySelector('.think-body').textContent=thinkText; stick(); }
        else if(ev==='approval_request'){
          // Without this the engine blocks for the full approval timeout and
          // then declines -- a five-minute freeze showing only a caret.
          const el=document.createElement('div'); el.className='approval';
          el.innerHTML='<b></b><code></code><div class="btns">'
            +'<button class="allow">Allow once</button>'
            +'<button class="always">Always allow</button>'
            +'<button class="deny">Deny</button></div>';
          el.querySelector('b').textContent='Allow '+data.name+'?';
          el.querySelector('code').textContent=JSON.stringify(data.args||{});
          const answer=async choice=>{
            const btns=el.querySelector('.btns');
            // Only report the decision once the engine has acknowledged it.
            // Announcing it first meant a failed request still read as
            // "Allowed" while the run sat blocked until its timeout.
            btns.innerHTML='<span class="hint">Sending\u2026</span>';
            try{
              const r=await fetch('http://127.0.0.1:'+PORT+'/approve/'+data.approval_id,
                {method:'POST',headers:{'content-type':'application/json'},
                 body:JSON.stringify({choice})});
              if(!r.ok) throw new Error('engine returned '+r.status);
              btns.innerHTML='<span class="hint">'
                +(choice==='deny'?'Denied':'Allowed')+'</span>';
            }catch(e){
              btns.innerHTML='<span class="hint" style="color:var(--bad)">'
                +'Could not send your decision \u2014 '+e.message+'</span>';
              const retry=document.createElement('button');
              retry.className='ctool'; retry.textContent='Retry';
              retry.onclick=()=>answer(choice); btns.appendChild(retry);
            }
          };
          el.querySelector('.allow').onclick=()=>answer('allow');
          el.querySelector('.always').onclick=()=>answer('always');
          el.querySelector('.deny').onclick=()=>answer('deny');
          host.appendChild(el); stick(); }
        else if(ev==='tool_drafting'){
          // A status, not a row. Materialising a card from a name-only event
          // strands an argless placeholder if the call is abandoned.
          if(!draft){ draft=document.createElement('div'); draft.className='drafting';
                      host.appendChild(draft); }
          draft.textContent=`Preparing ${data.name}…`; stick(); }
        else if(ev==='tool_call'){ paint(); draft?.remove(); draft=null;
                                   toolCard(host,data.call_id,data.name,data.args); }
        else if(ev==='tool_result'){ toolResult(host,data.call_id,data.name,data.ok,data.output,data.seconds); }
        else if(ev==='usage'){
          const st=document.createElement('div'); st.className='stats';
          st.textContent=`${data.chars} chars · ${data.seconds}s`
            +(data.ttft!=null?` · ${data.ttft}s to first token`:'');
          host.appendChild(st); }
        else if(ev==='error'){ out.innerHTML=md(acc);
          const titles={auth:'Authentication failed',rate_limit:'Rate limited',
                        empty:'No output',internal:'The engine reported an error'};
          fail(titles[data.kind]||titles.internal, data.message,'', text); }
        else if(ev==='cancelled'){ paint();
          const c=document.createElement('div'); c.className='cancelled';
          c.textContent='Stopped'; out.parentElement.appendChild(c); }
        else if(ev==='end'){ paint(); userIndex=data?.user_index ?? null;
          versions=data?.versions ?? 1; vactive=data?.active ?? 0; }
      }
    }
    paint();
    if(!acc) fail('No output','The engine finished without producing any text.','',text);
  }catch(err){ fail('Connection to the engine failed', String(err),'', text); }
  finally{
    clearInterval(thinkTimer); draft?.remove();
    addActions(out.parentElement, text, acc, userIndex, versions, vactive);
    out.parentElement.classList.remove('live');
    activeRun=null; activeReader=null;
    stopBtn.style.display='none'; send.style.display='';
    box.focus();
    refreshChats();
    running=false;
    // Drain one at a time so ordering is preserved and a queued prompt cannot
    // start before the turn ahead of it has been persisted.
    if(queue.length){
      const next=queue.shift(); renderQueue();
      setComposer(next); document.getElementById('f').requestSubmit();
    }
  }
});

stopBtn.addEventListener('click',async()=>{
  if(!activeRun) return;
  stopBtn.disabled=true;
  // Tell the engine first, then drop the reader. Cancelling only client-side
  // would leave the engine generating into a socket nobody reads.
  try{ await fetch(`http://127.0.0.1:${PORT}/cancel/${activeRun}`,{method:'POST'}); }catch{}
  try{ await activeReader?.cancel(); }catch{}
  if(queue.length){ queue.length=0; renderQueue(); }
  stopBtn.disabled=false;
});

},true);

  overlay.classList.remove('open');

  // <body> and the next Tab starts from the top of the page.

/** Keep Tab inside the open dialog. A modal the user can tab out of is not
 *  modal, and everything behind it is inert to the eye but not the keyboard. */
overlay.addEventListener('keydown',e=>{
  if(e.key!=='Tab' || !overlay.classList.contains('open')) return;
  const focusable=[...panel.querySelectorAll(
    'button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(el=>!el.disabled && el.offsetParent!==null);
  if(!focusable.length) return;
  const first=focusable[0], last=focusable[focusable.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});

// ---- attachments ----
const chips=document.getElementById('chips'), filein=document.getElementById('filein');
let attached=[]; const MAX_ATT=100000;
function renderChips(){
  chips.innerHTML='';
  attached.forEach((a,i)=>{
    const c=document.createElement('span'); c.className='chip';
    c.innerHTML='<b></b><span></span><span class="x">&times;</span>';
    c.querySelector('b').textContent=a.name;
    c.querySelector('span').textContent=(a.text.length/1024).toFixed(1)+' kB';
    c.querySelector('.x').onclick=()=>{ attached.splice(i,1); renderChips(); };
    chips.appendChild(c);
  });

async function addFiles(list){
  for(const f of [...list].slice(0,5)){
    if(f.size>2000000){ fail('File too large', f.name+' is over 2 MB.',''); continue; }
    const text=await f.text();
    // Clipped here, while the chip reports the real size, so a truncated file
    // can never be mistaken for a complete one.
    attached.push({name:f.name, text:text.slice(0,MAX_ATT)});
  }
  renderChips();
}
// condense_paste: a wall of pasted text becomes an attachment chip instead of
// filling the composer. Done here rather than in the engine, because condensing
// after the prompt is already assembled saves nothing -- the text still travels.
box.addEventListener('paste',ev=>{
  const limit=Number(CFG.condense_paste)||0;
  if(!limit) return;
  const text=(ev.clipboardData||window.clipboardData)?.getData('text')||'';
  if(text.length<=limit) return;
  ev.preventDefault();
  attached.push({name:`pasted-${attached.length+1}.txt`, text:text.slice(0,MAX_ATT)});
  renderChips();
  toast(`Pasted ${text.length.toLocaleString()} characters as an attachment.`);
});
