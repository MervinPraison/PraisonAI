{{- if and .Values.postgres.enabled (not .Values.postgres.auth.existingSecret) .Values.postgres.auth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "praisonai-agents-api.postgresSecretName" . }}
  labels:
    {{- include "praisonai-agents-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.postgres.auth.secretKey }}: {{ .Values.postgres.auth.password | quote }}
{{- end }}
