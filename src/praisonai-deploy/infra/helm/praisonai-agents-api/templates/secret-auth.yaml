{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) .Values.auth.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "praisonai-agents-api.authSecretName" . }}
  labels:
    {{- include "praisonai-agents-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.token | quote }}
{{- end }}
