# Deploys the prebuilt PraisonAI image (no Dockerfile required).
# Pin a version tag instead of `latest` for production deployments.
services:
  - type: web
    name: praisonai-api
    runtime: image
    image:
      url: ghcr.io/mervinpraison/praisonai:latest
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PRAISONAI_API_AUTH
        value: enabled
