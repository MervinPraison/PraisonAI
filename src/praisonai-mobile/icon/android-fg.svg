<?xml version="1.0" encoding="UTF-8"?>
<!--
  Android adaptive-icon FOREGROUND layer: the same mark as app-icon.svg on a
  transparent canvas, scaled to 56% so it sits inside the 66% safe zone that
  every launcher mask (circle, squircle, rounded square) leaves untouched.
  The background layer is the flat colour in icon.json (bg_color), which is
  the same #312E81 the master uses, so the two compose to the master.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g transform="translate(512 512) scale(0.56) translate(-512 -512)">
    <path fill="#FFFFFF" fill-rule="evenodd"
          d="M252,152 H512 A260,260 0 0 1 512,672 H372 V872 H252 Z
             M372,272 H512 A140,140 0 0 1 512,552 H372 Z"/>
    <circle cx="712" cy="812" r="60" fill="#F59E0B"/>
  </g>
</svg>
