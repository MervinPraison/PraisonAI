<?xml version="1.0" encoding="UTF-8"?>
<!--
  Android 13+ themed-icon layer: the launcher tints this single-colour
  silhouette itself, so the amber dot becomes the same colour as the P. Same
  geometry and scale as android-fg.svg so the themed and untinted icons line up.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g transform="translate(512 512) scale(0.56) translate(-512 -512)" fill="#FFFFFF">
    <path fill-rule="evenodd"
          d="M252,152 H512 A260,260 0 0 1 512,672 H372 V872 H252 Z
             M372,272 H512 A140,140 0 0 1 512,552 H372 Z"/>
    <circle cx="712" cy="812" r="60"/>
  </g>
</svg>
