[package]
name = "tauri-plugin-secrets"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The platform secret store -- iOS/macOS Keychain and the Android Keystore -- behind one Rust API."
publish = false
# Required by tauri-plugin's build script, and load-bearing beyond that: it is
# what turns this crate's `cargo:android_library_path` into the
# `DEP_TAURI_PLUGIN_SECRETS_ANDROID_LIBRARY_PATH` that tauri-build reads to add
# android/ to the app's Gradle project. Drop it and the Kotlin half is silently
# never compiled in -- and on Android that is the entire store.
links = "tauri-plugin-secrets"

[lib]
name = "tauri_plugin_secrets"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# APPLE ONLY, and only these two.
#
# `security-framework` is the Rust binding to the same `SecItemAdd` /
# `SecItemCopyMatching` / `SecItemDelete` C calls a Swift keychain helper would
# make -- so the iOS half of this plugin needs no Swift package, no Xcode
# target, and nothing that can only be compiled on a Mac with a device
# attached. It also means the Apple path is exercised by `cargo test` on any
# macOS box, against the real Keychain, which a Swift half would not be.
#
# `security-framework-sys` is here for exactly one symbol: `errSecItemNotFound`.
# Absence is not an error at this port's boundary, and hardcoding -25300 is how
# a magic number outlives the reason for it.
[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework = "3"
security-framework-sys = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
