[package]
name = "praisonai-mobile"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "PraisonAI mobile shell."

[lib]
name = "praisonai_mobile_lib"
path = "src/lib.rs"
# All three matter, and each one is a different platform:
#   staticlib -- iOS links the Rust into the Xcode app target.
#   cdylib    -- Android loads it with System.loadLibrary via android_binding!.
#   rlib      -- so src/main.rs, the desktop dev binary, can call run().
# Dropping any one breaks exactly one platform, at link time rather than here.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "praisonai-mobile"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# openExternal: `plugin:opener|open_url` in adapters/src/tauri/bridge.ts. Until
# this was here that invoke rejected, the bridge swallowed it, and on iOS
# (no window.open) openExternal returned true having done nothing.
tauri-plugin-opener = "2"
# Android's system back gesture, delivered to Rust so `shell::back::Gate` can
# arbitrate it. In-repo: it is a Kotlin OnBackPressedCallback plus a Channel,
# and no published plugin routes the press through Rust. Inert off Android.
tauri-plugin-back-gesture = { path = "plugins/back-gesture" }
# The platform secret store: iOS/macOS Keychain, Android Keystore. In-repo for
# the same reason back-gesture is -- no published plugin does BOTH platforms
# (tauri-plugin-stronghold is a password-protected file, `keyring` has no
# Android backend), and the Android half has to be Kotlin. See its module
# header for what was rejected and why.
tauri-plugin-secrets = { path = "plugins/secrets" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# The in-repo plugin is a member so the CI commands run from this directory
# (`cargo test`, `cargo clippy --all-targets -- -D warnings`, `cargo check
# --lib --target ...`) build and lint it too. As a bare path dependency it
# would compile with lints capped and its own tests would never run.
[workspace]
members = ["plugins/back-gesture", "plugins/secrets"]
default-members = [".", "plugins/back-gesture", "plugins/secrets"]

[dev-dependencies]
# The shell logic is tested without a Tauri app: emitting and falling back are
# injected traits, so the arbitration is exercised on a laptop.
serde_json = "1"
# `test` gives the mock runtime, which is what lets tests/wiring.rs build the
# REAL builder chain (`configure`) and put a real `Window` through
# `shell::on_window_event`. A dev-dependency, so the feature is not compiled
# into the app: resolver v2 keeps dev-only features out of the lib build.
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "debuginfo"
# Deliberately NOT panic = "abort", unlike the desktop crate.
#
# tauri-macros' mobile_entry_point wraps the app in catch_unwind so a Rust
# panic prints a message and aborts cleanly rather than unwinding across the
# JNI/ObjC boundary, which is undefined behaviour. panic = "abort" turns that
# into a bare SIGABRT with no message -- and on a phone, where there is no
# console to attach, that is the difference between a crash you can read and
# one you cannot.
